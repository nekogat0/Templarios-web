<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interfaz del Atlas - Inicio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050108;
            font-family: 'Courier New', Courier, monospace;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        .title-overlay {
            position: absolute;
            top: 22%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #ff3366;
            font-size: 2.5rem;
            font-weight: bold;
            letter-spacing: 4px;
            text-shadow: 0 0 10px #ff0033, 0 0 20px #ff0033, 0 0 30px #ff0033;
            pointer-events: none;
            animation: pulse 2s infinite alternate;
        }

        .access-btn {
            position: absolute;
            bottom: 8%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(5, 1, 8, 0.85);
            color: #ff3366;
            border: 1.5px solid #ff3366;
            padding: 8px 18px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 51, 102, 0.3);
            transition: all 0.3s ease;
            z-index: 10;
            text-align: center;
            max-width: 90%;
        }

        .access-btn:hover {
            background: #ff3366;
            color: #ffffff;
            box-shadow: 0 0 20px #ff0033, 0 0 30px #ff0033;
            transform: translateX(-50%) scale(1.03);
        }

        @keyframes pulse {
            0% { opacity: 0.8; text-shadow: 0 0 10px #ff0033; }
            100% { opacity: 1; text-shadow: 0 0 25px #ff3366, 0 0 35px #ff3366; }
        }
    </style>
</head>
<body>

    <div class="title-overlay">INTERFAZ DEL ATLAS</div>
    
    <button class="access-btn" onclick="ingresarAlSistema()">ACCEDER AL ARCHIVO DE LOS TEMPLARIOS LA TERMINAL DEL ATLAS</button>

    <canvas id="canvas"></canvas>

    <!-- Elemento de audio para la música de fondo -->
    <audio id="bg-audio" loop>
        <source src="musica/musica7.mp3" type="audio/mpeg">
        Tu navegador no soporta el elemento de audio.
    </audio>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const bgAudio = document.getElementById('bg-audio');

        // Activación de audio al cargar o primer contacto
        window.addEventListener('DOMContentLoaded', () => {
            bgAudio.play().catch(() => {
                const activarAudioAlInteractuar = () => {
                    bgAudio.play().then(() => {
                        window.removeEventListener('mousemove', activarAudioAlInteractuar);
                        window.removeEventListener('touchstart', activarAudioAlInteractuar);
                        window.removeEventListener('click', activarAudioAlInteractuar);
                    }).catch(() => {});
                };
                window.addEventListener('mousemove', activarAudioAlInteractuar, { once: true });
                window.addEventListener('touchstart', activarAudioAlInteractuar, { once: true });
                window.addEventListener('click', activarAudioAlInteractuar, { once: true });
            });
        });

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const interfaceItems = [
            { category: "INFORMACIÓN EXTRA", name: "bases" },
            { category: "INFORMACIÓN EXTRA", name: "brújula" },
            { category: "INFORMACIÓN EXTRA", name: "chat" },
            { category: "INFORMACIÓN EXTRA", name: "generador de título y rango" },
            { category: "INFORMACIÓN EXTRA", name: "guerra o la arena" },
            { category: "INFORMACIÓN EXTRA", name: "inquisición" },
            { category: "INFORMACIÓN EXTRA", name: "licencia" },
            { category: "INFORMACIÓN EXTRA", name: "lore" },
            { category: "INFORMACIÓN EXTRA", name: "medallas" },
            { category: "INFORMACIÓN EXTRA", name: "mensajes perdidos" },
            { category: "INFORMACIÓN EXTRA", name: "misiones" },
            { category: "INFORMACIÓN EXTRA", name: "oráculo" },
            { category: "INFORMACIÓN EXTRA", name: "reporte" },
            { category: "INFORMACIÓN EXTRA", name: "reproductor" },
            { category: "INFORMACIÓN EXTRA", name: "holo" },
            { category: "INFORMACIÓN EXTRA", name: "simulador" },
            { category: "INFORMACIÓN EXTRA", name: "sistema" },
            { category: "INFORMACIÓN EXTRA", name: "tarjeta" },
            { category: "INFORMACIÓN EXTRA", name: "traductor" }
        ];

        const numNodes = 45;
        const nodes = [];
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2 + 30;

        for (let i = 0; i < numNodes; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 50 + Math.random() * 350;
            nodes.push({
                x: centerX + Math.cos(angle) * radius,
                y: centerY + Math.sin(angle) * radius,
                baseRadius: radius,
                angle: angle,
                speed: (Math.random() - 0.5) * 0.005,
                size: Math.random() * 2 + 1,
                chaosOffset: 0
            });
        }

        let itemIndex = 0;
        let itemTimer = 0;
        let currentText = { category: "INFORMACIÓN EXTRA", name: "Cargando módulos..." };

        let isInteracting = false;
        let interactionFactor = 1;

        let clickCount = 0;
        let secretActive = false;
        let secretTimer = 0;

        function triggerInteraction(e) {
            if (bgAudio.paused) bgAudio.play().catch(() => {});
            if (e && e.target.tagName === 'BUTTON') return;

            clickCount++;
            if (!secretActive) {
                if (clickCount >= 10) {
                    secretActive = true;
                    clickCount = 0;
                    secretTimer = 240;
                }
            }

            isInteracting = true;
            interactionFactor = 3.5;
            setTimeout(() => {
                isInteracting = false;
            }, 800);
        }

        window.addEventListener('mousedown', triggerInteraction);
        window.addEventListener('touchstart', (e) => {
            if(e.target.tagName !== 'BUTTON') {
                e.preventDefault();
                triggerInteraction(e);
            } else {
                if (bgAudio.paused) bgAudio.play().catch(() => {});
            }
        }, { passive: false });

        let colorTransition = 0;

        function animate() {
            ctx.fillStyle = 'rgba(5, 1, 8, 0.25)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Transición del fondo entre Rojo y Dorado
            colorTransition += 0.02;
            const t = (Math.sin(colorTransition) + 1) / 2;
            const r = Math.round(255);
            const g = Math.round(50 + (215 - 50) * t);
            const b = Math.round(100 * (1 - t));

            if (!isInteracting && interactionFactor > 1) {
                interactionFactor -= 0.05;
            }

            ctx.lineWidth = 1;

            // Movimiento estilo red neuronal orgánica
            for (let i = 0; i < nodes.length; i++) {
                nodes[i].angle += nodes[i].speed * interactionFactor;
                
                if (isInteracting) {
                    nodes[i].chaosOffset = (Math.random() - 0.5) * 40;
                } else {
                    nodes[i].chaosOffset *= 0.95;
                }

                const currentRadius = nodes[i].baseRadius + nodes[i].chaosOffset;
                nodes[i].x = canvas.width / 2 + Math.cos(nodes[i].angle) * currentRadius;
                nodes[i].y = (canvas.height / 2 + 30) + Math.sin(nodes[i].angle) * currentRadius;

                ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
                ctx.beginPath();
                ctx.arc(nodes[i].x, nodes[i].y, nodes[i].size * (isInteracting ? 1.5 : 1), 0, Math.PI * 2);
                ctx.fill();

                for (let j = i + 1; j < nodes.length; j++) {
                    const dx = nodes[i].x - nodes[j].x;
                    const dy = nodes[i].y - nodes[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    const maxDist = isInteracting ? 160 : 120;
                    if (dist < maxDist) {
                        const alpha = (1 - dist / maxDist) * (isInteracting ? 0.6 : 0.2);
                        ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
                        ctx.beginPath();
                        ctx.moveTo(nodes[i].x, nodes[i].y);
                        ctx.lineTo(nodes[j].x, nodes[j].y);
                        ctx.stroke();
                    }
                }
            }

            // Símbolo secreto al hacer clics múltiples
            if (secretActive) {
                secretTimer--;
                
                ctx.save();
                let cx = canvas.width / 2;
                let cy = canvas.height / 2 + 20;

                ctx.strokeStyle = '#ff3366';
                ctx.lineWidth = 2;
                ctx.shadowColor = '#ff0033';
                ctx.shadowBlur = 20;
                ctx.strokeRect(cx - 30, cy - 30, 60, 60);

                ctx.strokeStyle = '#ffd700';
                ctx.lineWidth = 2;
                ctx.shadowColor = '#ffd700';
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.moveTo(cx, cy - 25);
                ctx.lineTo(cx + 18, cy);
                ctx.lineTo(cx, cy + 25);
                ctx.lineTo(cx - 18, cy);
                ctx.closePath();
                ctx.stroke();

                ctx.fillStyle = '#ff0033';
                ctx.shadowColor = '#ff0033';
                ctx.shadowBlur = 25;
                ctx.beginPath();
                ctx.arc(cx, cy, 7, 0, Math.PI * 2);
                ctx.fill();

                ctx.textAlign = 'center';
                ctx.font = 'bold 15px "Courier New", monospace';
                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = '#ffd700';
                ctx.shadowBlur = 15;
                ctx.fillText("✦ [ NÚCLEO SUPREMO DEL ATLAS ] ✦", cx, cy + 75);
                
                ctx.restore();

                if (secretTimer <= 0) {
                    secretActive = false;
                }
            } else {
                itemTimer++;
                if (itemTimer > 100) {
                    itemTimer = 0;
                    currentText = interfaceItems[itemIndex];
                    itemIndex = (itemIndex + 1) % interfaceItems.length;
                }

                ctx.textAlign = 'center';
                
                ctx.font = '14px "Courier New", monospace';
                ctx.fillStyle = 'rgba(255, 150, 180, 0.8)';
                ctx.fillText(`— [ ${currentText.category} ] —`, canvas.width / 2, canvas.height / 2 + 70);

                ctx.font = 'bold 22px "Courier New", monospace';
                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = '#ff0033';
                ctx.shadowBlur = 15;
                ctx.fillText(currentText.name.toUpperCase(), canvas.width / 2, canvas.height / 2 + 105);
                ctx.shadowBlur = 0;
            }

            ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
            for (let y = 0; y < canvas.height; y += 4) {
                ctx.fillRect(0, y, canvas.width, 1);
            }

            requestAnimationFrame(animate);
        }

        function ingresarAlSistema() {
            if (bgAudio.paused) bgAudio.play().catch(() => {});
            window.location.href = "menu.html";
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        animate();
    </script>
</body>
</html>
