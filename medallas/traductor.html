<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traductor Cuántico - Templarios del Atlas</title>
    <style>
        :root {
            --bg-dark: #000000;
            --container-bg: #050505;
            --neon-red: #ff003c;
            --neon-gold: #ffaa00;
            --text-main: #ffffff;
            --text-dim: #b3b3b3;
            --glow-red: 0 0 25px rgba(255, 0, 60, 0.8), inset 0 0 15px rgba(255, 0, 60, 0.4);
            --glow-gold: 0 0 15px rgba(255, 170, 0, 0.6);
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 30px;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        /* EFECTO CRT / BOMBILLA INTENSIFICADO GLOBAL */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.45) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 999;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
        }

        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: rgba(255, 0, 60, 0.06);
            opacity: 0;
            z-index: 1000;
            pointer-events: none;
            animation: crtFlicker 0.12s infinite;
        }

        @keyframes crtFlicker {
            0% { opacity: 0.04; }
            50% { opacity: 0.12; }
            100% { opacity: 0.04; }
        }

        /* MARCO EXTERIOR DE LA PANTALLA (ROJO NEÓN FOSFORESCENTE CON ESQUINAS DORADAS) */
        .screen-frame {
            position: fixed;
            top: 12px;
            left: 12px;
            right: 12px;
            bottom: 12px;
            border: 2px solid var(--neon-red);
            box-shadow: var(--glow-red);
            pointer-events: none;
            z-index: 998;
        }

        .screen-corner {
            position: absolute;
            width: 14px;
            height: 14px;
            border: 3px solid var(--neon-gold);
            box-shadow: var(--glow-gold);
            background: rgba(255, 170, 0, 0.2);
        }
        .sc-tl { top: -3px; left: -3px; border-right: none; border-bottom: none; }
        .sc-tr { top: -3px; right: -3px; border-left: none; border-bottom: none; }
        .sc-bl { bottom: -3px; left: -3px; border-right: none; border-top: none; }
        .sc-br { bottom: -3px; right: -3px; border-left: none; border-top: none; }

        /* PARTÍCULAS DINÁMICAS */
        .particle {
            position: fixed;
            background: var(--neon-gold);
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
            animation: floatParticle linear infinite;
            opacity: 0.5;
        }

        @keyframes floatParticle {
            0% { transform: translateY(105vh) translateX(0); opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { transform: translateY(-10vh) translateX(40px); opacity: 0; }
        }

        .container {
            background: var(--container-bg);
            border: 2px solid var(--neon-red);
            border-radius: 8px;
            padding: 22px;
            box-shadow: var(--glow-red);
            width: 100%;
            max-width: 580px;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .back-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #000000;
            color: var(--neon-gold);
            border: 1px solid var(--neon-gold);
            padding: 5px 10px;
            font-size: 11px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            box-shadow: 0 0 8px rgba(255, 170, 0, 0.3);
            transition: all 0.3s ease;
        }
        .back-btn:hover {
            background: var(--neon-gold);
            color: #000000;
            box-shadow: var(--glow-gold);
        }

        h2 {
            color: var(--neon-red);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 5px;
            margin-bottom: 15px;
            font-size: 1.2rem;
            text-shadow: 0 0 10px rgba(255, 0, 60, 0.8);
        }

        label {
            display: block;
            text-align: left;
            color: var(--neon-gold);
            font-size: 0.82rem;
            margin-bottom: 4px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 0 6px rgba(255, 170, 0, 0.4);
        }

        textarea {
            width: 100%;
            height: 85px;
            background: #000000;
            color: var(--text-main);
            border: 1px solid var(--neon-gold);
            border-radius: 5px;
            padding: 10px;
            font-size: 14px;
            resize: none;
            box-sizing: border-box;
            margin-bottom: 15px;
            font-family: 'Courier New', Courier, monospace;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        textarea:focus {
            outline: none;
            border-color: var(--neon-red);
            box-shadow: 0 0 12px rgba(255, 0, 60, 0.7);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        button.action-btn {
            background: var(--neon-red);
            color: #ffffff;
            border: 1px solid var(--neon-gold);
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            letter-spacing: 1px;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 0, 60, 0.6);
        }
        button.action-btn:hover {
            background: #ff1a4d;
            box-shadow: 0 0 20px rgba(255, 0, 60, 0.9);
        }

        .note {
            font-size: 10px;
            color: var(--text-dim);
            margin-top: 12px;
            border-top: 1px solid rgba(255, 170, 0, 0.2);
            padding-top: 8px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <!-- MARCO EXTERIOR CON ESQUINAS DORADAS -->
    <div class="screen-frame">
        <div class="screen-corner sc-tl"></div>
        <div class="screen-corner sc-tr"></div>
        <div class="screen-corner sc-bl"></div>
        <div class="screen-corner sc-br"></div>
    </div>

    <!-- GENERADOR DE PARTÍCULAS -->
    <script>
        for (let i = 0; i < 25; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.top = Math.random() * 100 + 'vh';
            const size = Math.random() * 3 + 1;
            p.style.width = size + 'px';
            p.style.height = size + 'px';
            p.style.animationDuration = (Math.random() * 8 + 4) + 's';
            p.style.animationDelay = (Math.random() * 4) + 's';
            document.body.appendChild(p);
        }
    </script>

<div class="container">
    <a href="index.html" class="back-btn">&larr; VOLVER</a>
    <h2>Terminal de Cifrado Caótico</h2>
    
    <label for="inputTexto">&gt; INTRODUZCA FLUJO DE DATOS:</label>
    <textarea id="inputTexto" placeholder="Escribe tu mensaje aquí..."></textarea>

    <div class="controls">
        <button class="action-btn" onclick="cifrarMezcla()">[ CIFRAR CAOS ]</button>
        <button class="action-btn" onclick="descifrarSeleccion()">[ DESCIFRAR PARTE ]</button>
    </div>

    <label for="outputTexto">&gt; RESULTADO DE LA TRANSMISIÓN:</label>
    <textarea id="outputTexto" placeholder="El resultado aparecerá aquí..." readonly></textarea>

    <div class="note">PROTOCOLO ACTIVO // GASTER - SANS - PAPYRUS MIX</div>
</div>

<script>
    const gasterMap = {'a': '🕆', 'b': '🕈', 'c': '⚐', 'd': '🕡', 'e': '🕢', 'f': '🕣', 'g': '📁', 'h': '📂', 'i': '📄', 'j': '📃', 'l': '👁', 'm': '✋', 'n': '✌', 'o': '👌', 'p': '👍', 'q': '👎', 'r': '✊', 'u': '💀', 'v': '👻', 'w': '☠', 'x': '👾', 'y': '🤖', 'z': '🎃', ' ': ' '};
    const reverseGaster = Object.fromEntries(Object.entries(gasterMap).map(([k, v]) => [v, k]));

    function cifrarMezcla() {
        let texto = document.getElementById('inputTexto').value.toLowerCase();
        let palabras = texto.split(' ');
        let resultadoFinal = [];

        palabras.forEach(palabra => {
            let estilo = Math.floor(Math.random() * 3);
            let palabraModificada = "";

            if (estilo === 0) {
                for (let char of palabra) {
                    palabraModificada += gasterMap[char] || char;
                }
                palabraModificada = "[G:" + palabraModificada + "]";
            } else if (estilo === 1) {
                palabraModificada = palabra.split('').reverse().join('') + "..zZ";
            } else {
                palabraModificada = "NYEH!" + palabra.toUpperCase() + "!NYEH";
            }
            resultadoFinal.push(palabraModificada);
        });

        document.getElementById('outputTexto').value = resultadoFinal.join(' ');
    }

    function descifrarSeleccion() {
        let texto = document.getElementById('inputTexto').value.trim();
        let resultado = "";

        if (texto.startsWith("NYEH!")) {
            resultado = texto.replace(/NYEH!/g, "").replace(/!NYEH/g, "").toLowerCase();
        } else if (texto.includes("..zZ")) {
            let limpio = texto.replace("..zZ", "");
            resultado = limpio.split('').reverse().join('');
        } else {
            let limpio = texto.replace(/^\[G:|\]$/g, "");
            for (let char of limpio) {
                resultado += reverseGaster[char] || char;
            }
        }

        document.getElementById('outputTexto').value = resultado || "ERROR DE DESCODIFICACIÓN. AISLE EL FRAGMENTO.";
    }
</script>

</body>
</html>
