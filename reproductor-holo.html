<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Templarios del Atlas | Holo-Reproductor de Beats</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&family=Share+Tech+Mono&display=swap');

    :root {
      --bg-dark: #010103;
      --player-bg: rgba(6, 9, 16, 0.95);
      --neon-red: #ff004c;
      --neon-gold: #ffaa00;
      --neon-green: #00ff66;
      --glow-red: 0 0 25px rgba(255, 0, 76, 0.9), inset 0 0 15px rgba(255, 0, 76, 0.5);
      --glow-gold: 0 0 15px rgba(255, 170, 0, 0.6);
      --glow-green: 0 0 18px rgba(0, 255, 102, 0.7);
      --text-main: #f2e3c6;
      --border-hud: rgba(255, 170, 0, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 25px;
      position: relative;
      overflow-x: hidden;
    }

    /* MARCO CRT EXTERIOR CON ESQUINAS EN L */
    .screen-frame {
      position: fixed;
      top: 10px; left: 10px; right: 10px; bottom: 10px;
      border: 2px solid var(--neon-red);
      box-shadow: var(--glow-red);
      pointer-events: none;
      z-index: 998;
    }

    .screen-corner {
      position: absolute;
      width: 18px; height: 18px;
      border: 2px solid var(--neon-gold);
      box-shadow: 0 0 10px var(--neon-gold);
      background: transparent;
    }
    .sc-tl { top: -2px; left: -2px; border-right: none; border-bottom: none; }
    .sc-tr { top: -2px; right: -2px; border-left: none; border-bottom: none; }
    .sc-bl { bottom: -2px; left: -2px; border-right: none; border-top: none; }
    .sc-br { bottom: -2px; right: -2px; border-left: none; border-top: none; }

    /* LÍNEAS DE ESCANEO CRT Y EFECTO PARPADEO */
    body::before {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%), 
                  linear-gradient(90deg, rgba(255, 0, 76, 0.04), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.04));
      z-index: 999;
      background-size: 100% 4px, 4px 100%;
      pointer-events: none;
    }

    body::after {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: rgba(255, 0, 76, 0.04);
      opacity: 0;
      z-index: 1000;
      pointer-events: none;
      animation: crtFlicker 0.12s infinite;
    }

    @keyframes crtFlicker {
      0% { opacity: 0.03; }
      50% { opacity: 0.08; }
      100% { opacity: 0.03; }
    }

    .runic-text {
      font-family: 'Share Tech Mono', monospace !important;
      color: var(--neon-gold) !important;
      letter-spacing: 1.5px;
      text-shadow: 0 0 8px rgba(255, 170, 0, 0.8);
      text-transform: uppercase;
    }

    /* CONTENEDOR PRINCIPAL TIPO HUD */
    .audio-player-card {
      background: var(--player-bg);
      border: 1px solid var(--border-hud);
      border-radius: 8px;
      padding: 30px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 0 35px rgba(255, 0, 76, 0.25);
      position: relative;
      z-index: 2;
    }

    /* ESQUINAS INTERIORES EN L */
    .hud-corner { position: absolute; width: 8px; height: 8px; border: 2px solid var(--neon-gold); pointer-events: none; z-index: 12; background: transparent; }
    .c1 { top: -2px; left: -2px; border-right: none; border-bottom: none; }
    .c2 { top: -2px; right: -2px; border-left: none; border-bottom: none; }
    .c3 { bottom: -2px; left: -2px; border-right: none; border-top: none; }
    .c4 { bottom: -2px; right: -2px; border-left: none; border-top: none; }

    .player-header {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      color: #fff;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-hud);
      padding-bottom: 10px;
    }

    .player-header span {
      background: var(--neon-red);
      width: 10px; height: 10px;
      border-radius: 2px;
      box-shadow: var(--glow-red);
    }

    /* INFORMACIÓN DE LA PISTA */
    .track-info {
      text-align: center;
      margin-bottom: 20px;
      background: rgba(255, 0, 76, 0.03);
      border: 1px solid rgba(255, 0, 76, 0.2);
      padding: 12px;
      border-radius: 4px;
    }

    .track-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 10px rgba(255,255,255,0.4);
      margin-bottom: 4px;
    }

    .track-artist {
      font-size: 0.85rem;
      color: var(--neon-gold);
      letter-spacing: 1px;
    }

    /* MATRIZ DE RITMOS ESTILO NMS (BEAT GENERATOR) */
    .nms-beat-matrix {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 6px;
      margin-bottom: 20px;
      background: rgba(0,0,0,0.6);
      border: 1px dashed var(--border-hud);
      padding: 10px;
      border-radius: 4px;
    }

    .beat-node {
      height: 28px;
      background: rgba(255, 170, 0, 0.05);
      border: 1px solid rgba(255, 170, 0, 0.2);
      border-radius: 2px;
      transition: all 0.1s ease;
    }

    .beat-node.active-step {
      background: var(--neon-red);
      border-color: #fff;
      box-shadow: var(--glow-red);
    }

    /* VISUALIZADOR DE BARRAS CLÁSICO */
    .visualizer {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 4px;
      height: 35px;
      margin-bottom: 20px;
    }

    .bar {
      flex: 1;
      background: var(--neon-gold);
      box-shadow: var(--glow-gold);
      height: 10%;
      transition: height 0.1s ease;
    }

    /* BARRA DE PROGRESO */
    .progress-container {
      margin-bottom: 20px;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,170,0,0.2);
    }

    .progress-filled {
      height: 100%;
      width: 0%;
      background: var(--neon-red);
      box-shadow: var(--glow-red);
    }

    .time-codes {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.6);
      margin-top: 5px;
      font-family: 'Share Tech Mono', monospace;
    }

    /* CONTROLES */
    .player-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .btn-control {
      background: rgba(255, 170, 0, 0.1);
      border: 1px solid var(--neon-gold);
      color: var(--neon-gold);
      width: 42px; height: 42px;
      border-radius: 50%;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: var(--glow-gold);
      transition: all 0.2s ease;
    }

    .btn-control:hover {
      background: var(--neon-gold);
      color: #000;
      transform: scale(1.08);
    }

    .btn-play {
      width: 50px; height: 50px;
      background: rgba(255, 0, 76, 0.2);
      border-color: var(--neon-red);
      color: #fff;
      box-shadow: var(--glow-red);
      font-size: 1.1rem;
    }

    .btn-play:hover {
      background: var(--neon-red);
      color: #000;
    }

    /* LISTA DE REPRODUCCIÓN */
    .playlist {
      border-top: 1px solid var(--border-hud);
      padding-top: 15px;
      max-height: 160px;
      overflow-y: auto;
    }

    .playlist-item {
      padding: 8px 10px;
      font-size: 0.85rem;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      transition: background 0.2s;
      margin-bottom: 4px;
      color: rgba(255,255,255,0.7);
    }

    .playlist-item:hover {
      background: rgba(255, 170, 0, 0.1);
      color: #fff;
    }

    .playlist-item.active {
      background: rgba(255, 0, 76, 0.15);
      border-left: 3px solid var(--neon-red);
      color: #fff;
      font-weight: bold;
    }

    .nav-back {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: var(--neon-gold);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      text-decoration: none;
      letter-spacing: 1px;
    }
    .nav-back:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <!-- MARCO EXTERIOR CRT -->
  <div class="screen-frame">
    <div class="screen-corner sc-tl"></div>
    <div class="screen-corner sc-tr"></div>
    <div class="screen-corner sc-bl"></div>
    <div class="screen-corner sc-br"></div>
  </div>

  <div class="audio-player-card">
    <div class="hud-corner c1"></div><div class="hud-corner c2"></div>
    <div class="hud-corner c3"></div><div class="hud-corner c4"></div>

    <div class="player-header">
      <div>HOLO-BEAT GENERATOR [NMS]</div>
      <span></span>
    </div>

    <div class="track-info">
      <div class="track-title" id="trackTitle">MÚSICA 1</div>
      <div class="track-artist runic-text" id="trackArtist">TEMPLARIOS DEL ATLAS</div>
    </div>

    <!-- MATRIZ DE RITMOS HOLOGRÁFICA -->
    <div class="nms-beat-matrix" id="beatMatrix">
      <div class="beat-node"></div><div class="beat-node"></div>
      <div class="beat-node"></div><div class="beat-node"></div>
      <div class="beat-node"></div><div class="beat-node"></div>
      <div class="beat-node"></div><div class="beat-node"></div>
    </div>

    <!-- BARRAS DE AUDIO -->
    <div class="visualizer" id="visualizer">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div>
    </div>

    <div class="progress-container">
      <div class="progress-bar" id="progressBar">
        <div class="progress-filled" id="progressFilled"></div>
      </div>
      <div class="time-codes">
        <span id="currentTime">00:00</span>
        <span id="duration">00:00</span>
      </div>
    </div>

    <div class="player-controls">
      <button class="btn-control" id="prevBtn">⏮</button>
      <button class="btn-control btn-play" id="playBtn">▶</button>
      <button class="btn-control" id="nextBtn">⏭</button>
    </div>

    <!-- PLAYLIST CON MÚSICA 1 A 6 -->
    <div class="playlist" id="playlist">
      <div class="playlist-item active" data-src="musica/musica1.mp3" data-title="Música 1" data-artist="Templarios del Atlas">
        <span>01. Música 1</span>
        <span class="runic-text">MP3</span>
      </div>
      <div class="playlist-item" data-src="musica/musica2.mp3" data-title="Música 2" data-artist="Templarios del Atlas">
        <span>02. Música 2</span>
        <span class="runic-text">MP3</span>
      </div>
      <div class="playlist-item" data-src="musica/musica3.mp3" data-title="Música 3" data-artist="Templarios del Atlas">
        <span>03. Música 3</span>
        <span class="runic-text">MP3</span>
      </div>
      <div class="playlist-item" data-src="musica/musica4.mp3" data-title="Música 4" data-artist="Templarios del Atlas">
        <span>04. Música 4</span>
        <span class="runic-text">MP3</span>
      </div>
      <div class="playlist-item" data-src="musica/musica5.mp3" data-title="Música 5" data-artist="Templarios del Atlas">
        <span>05. Música 5</span>
        <span class="runic-text">MP3</span>
      </div>
      <div class="playlist-item" data-src="musica/musica6.mp3" data-title="Música 6" data-artist="Templarios del Atlas">
        <span>06. Música 6</span>
        <span class="runic-text">MP3</span>
      </div>
    </div>

    <a href="index.html" class="nav-back">⬅ Volver al Holo-Mapa</a>
  </div>

  <!-- ELEMENTO AUDIO CON PRELOAD -->
  <audio id="audioElement" preload="auto">
    <source src="musica/musica1.mp3" type="audio/mpeg">
    Tu navegador no soporta elementos de audio.
  </audio>

  <script>
    const audioElement = document.getElementById('audioElement');
    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const trackTitle = document.getElementById('trackTitle');
    const trackArtist = document.getElementById('trackArtist');
    const progressBar = document.getElementById('progressBar');
    const progressFilled = document.getElementById('progressFilled');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const playlistItems = document.querySelectorAll('.playlist-item');
    const bars = document.querySelectorAll('.bar');
    const beatNodes = document.querySelectorAll('.beat-node');

    let currentTrackIndex = 0;
    let isPlaying = false;
    let activeStep = 0;

    function loadTrack(index) {
      const item = playlistItems[index];
      const src = item.getAttribute('data-src');
      const title = item.getAttribute('data-title');
      const artist = item.getAttribute('data-artist');

      audioElement.src = src;
      audioElement.load();
      trackTitle.innerText = title;
      trackArtist.innerText = artist;

      playlistItems.forEach(el => el.classList.remove('active'));
      item.classList.add('active');
      currentTrackIndex = index;
    }

    function togglePlay() {
      if (isPlaying) {
        audioElement.pause();
        playBtn.innerText = "▶";
        isPlaying = false;
      } else {
        audioElement.play().then(() => {
          playBtn.innerText = "⏸";
          isPlaying = true;
        }).catch(error => {
          console.error("Error al reproducir el archivo de audio:", error);
          alert("No se pudo reproducir la pista. Revisa que el archivo exista en la carpeta 'musica'.");
          playBtn.innerText = "▶";
          isPlaying = false;
        });
      }
    }

    playBtn.addEventListener('click', togglePlay);

    playlistItems.forEach((item, index) => {
      item.addEventListener('click', () => {
        loadTrack(index);
        audioElement.play().then(() => {
          playBtn.innerText = "⏸";
          isPlaying = true;
        }).catch(err => console.log("Error en selección:", err));
      });
    });

    nextBtn.addEventListener('click', () => {
      currentTrackIndex = (currentTrackIndex + 1) % playlistItems.length;
      loadTrack(currentTrackIndex);
      if (isPlaying) audioElement.play();
    });

    prevBtn.addEventListener('click', () => {
      currentTrackIndex = (currentTrackIndex - 1 + playlistItems.length) % playlistItems.length;
      loadTrack(currentTrackIndex);
      if (isPlaying) audioElement.play();
    });

    audioElement.addEventListener('ended', () => {
      currentTrackIndex = (currentTrackIndex + 1) % playlistItems.length;
      loadTrack(currentTrackIndex);
      audioElement.play().catch(err => console.log("Error al pasar de pista:", err));
    });

    audioElement.addEventListener('timeupdate', () => {
      if (audioElement.duration && !isNaN(audioElement.duration)) {
        const progressPercent = (audioElement.currentTime / audioElement.duration) * 100;
        progressFilled.style.width = `${progressPercent}%`;

        let currentMinutes = Math.floor(audioElement.currentTime / 60);
        let currentSeconds = Math.floor(audioElement.currentTime % 60);
        currentTimeEl.innerText = `${String(currentMinutes).padStart(2, '0')}:${String(currentSeconds).padStart(2, '0')}`;

        let durMinutes = Math.floor(audioElement.duration / 60);
        let durSeconds = Math.floor(audioElement.duration % 60);
        durationEl.innerText = `${String(durMinutes).padStart(2, '0')}:${String(durSeconds).padStart(2, '0')}`;
      }
    });

    progressBar.addEventListener('click', (e) => {
      const width = progressBar.clientWidth;
      const clickX = e.offsetX;
      if (audioElement.duration && !isNaN(audioElement.duration)) {
        audioElement.currentTime = (clickX / width) * audioElement.duration;
      }
    });

    setInterval(() => {
      beatNodes.forEach((node, idx) => {
        if (isPlaying && idx === activeStep) {
          node.classList.add('active-step');
        } else {
          node.classList.remove('active-step');
        }
      });

      if (isPlaying) {
        activeStep = (activeStep + 1) % beatNodes.length;
        bars.forEach(bar => {
          bar.style.height = `${Math.floor(Math.random() * 80) + 15}%`;
        });
      } else {
        bars.forEach(bar => { bar.style.height = '10%'; });
      }
    }, 140);

    loadTrack(0);
  </script>
</body>
</html>
