<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Templarios del Atlas | Generador de Plano 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <style>
        :root { 
            --blueprint-bg: #000000; 
            --blueprint-text: #e2e8f0; 
            --blueprint-accent: #eab308; 
            --blueprint-border: #b91c1c;
        }
        body { 
            background-color: var(--blueprint-bg); 
            color: var(--blueprint-text); 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            font-family: 'Courier New', monospace; 
            overflow: hidden; 
        }

        /* EFECTO DE ESCANEO Y LÍNEAS CUÁNTICAS */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%), linear-gradient(90deg, rgba(239, 68, 68, 0.03), rgba(234, 179, 8, 0.01), rgba(0, 0, 0, 0.05));
            z-index: 999;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        .space-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #110202 0%, #000000 85%);
            z-index: -2;
        }

        /* POLVO ESPACIAL CÓSMICO */
        .cosmic-dust {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: -1;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eab308, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #ef4444, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, #b91c1c, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 160px 120px, #fde047, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 250px 250px;
            animation: cosmic-drift 20s linear infinite;
            opacity: 0.6;
        }

        @keyframes cosmic-drift {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-250px) rotate(5deg); }
        }

        /* MARCO DORADO Y ROJO FIJO */
        .golden-frame {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 100;
            border: 2px solid rgba(234, 179, 8, 0.35);
            margin: clamp(8px, 1.5vw, 20px);
            box-shadow: inset 0 0 25px rgba(234, 179, 8, 0.1), 0 0 15px rgba(239, 68, 68, 0.2);
        }

        .golden-frame::before, .golden-frame::after {
            content: "";
            position: absolute;
            width: clamp(15px, 3vw, 30px);
            height: clamp(15px, 3vw, 30px);
            border-color: #eab308;
            border-style: solid;
        }

        .golden-frame::before { top: -2px; left: -2px; border-width: 4px 0 0 4px; }
        .golden-frame::after { top: -2px; right: -2px; border-width: 4px 4px 0 0; }

        .corner-bottom-left, .corner-bottom-right {
            position: absolute;
            width: clamp(15px, 3vw, 30px);
            height: clamp(15px, 3vw, 30px);
            border-color: #eab308;
            border-style: solid;
        }
        .corner-bottom-left { bottom: -2px; left: -2px; border-width: 0 0 4px 4px; }
        .corner-bottom-right { bottom: -2px; right: -2px; border-width: 0 4px 4px 0; }

        #viewer-container { 
            flex: 0 0 40vh; 
            position: relative; 
            width: 100%;
            background: transparent;
        }
        #catalog-sidebar { 
            flex: 1;
            width: 100%; 
            background: rgba(5, 2, 2, 0.95); 
            border-top: 2px solid var(--blueprint-border); 
            padding: 10px 15px; 
            overflow-y: auto; 
            box-sizing: border-box;
            z-index: 10; 
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 0 40px rgba(185, 28, 28, 0.3), inset 0 0 25px rgba(0, 0, 0, 0.9);
        }
        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-home {
            background: #0d0202;
            border: 1px solid rgba(234, 179, 8, 0.3);
            color: var(--blueprint-accent);
            padding: 4px 8px;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            border-radius: 4px;
            transition: all 0.3s ease;
        }
        .btn-home:hover { 
            background: #991b1b; 
            color: #fde047; 
            border-color: #eab308;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.7);
        }

        .toolbar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
        }
        .toolbar button {
            padding: 6px 4px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            cursor: pointer;
            border: 1px solid var(--blueprint-border);
            background: #0d0202;
            color: var(--blueprint-text);
            font-size: 9px;
            border-radius: 4px;
            transition: all 0.2s ease;
        }
        .toolbar button.active-tool { background: #991b1b; color: #fde047; border-color: #eab308; box-shadow: 0 0 10px rgba(239, 68, 68, 0.5); }
        .toolbar button:hover { border-color: var(--blueprint-accent); color: var(--blueprint-accent); }

        .control-group {
            background: rgba(15, 3, 3, 0.9);
            border: 1px solid #450a0a;
            padding: 6px 8px;
            font-size: 10px;
            border-radius: 6px;
        }
        
        details.control-group {
            cursor: pointer;
        }
        details.control-group summary {
            font-weight: bold;
            color: var(--blueprint-accent);
            outline: none;
            user-select: none;
        }

        .scale-control {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .scale-control input {
            flex: 1;
            accent-color: var(--blueprint-accent);
        }

        .customization-section {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 4px;
            max-height: 80px;
            overflow-y: auto;
            margin-top: 4px;
        }
        .custom-btn {
            background: #0d0202;
            border: 1px solid #450a0a;
            color: var(--blueprint-text);
            padding: 4px;
            font-size: 9px;
            cursor: pointer;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border-radius: 4px;
        }
        .custom-btn:hover { background: rgba(185, 28, 28, 0.2); border-color: var(--blueprint-accent); color: var(--blueprint-accent); }

        .part-list {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
        }
        .part-item { 
            min-width: 55px; 
            width: 55px; 
            height: 55px; 
            background: #0d0202; 
            border: 1px solid #450a0a; 
            cursor: pointer; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            flex-shrink: 0;
            border-radius: 6px;
            transition: all 0.2s ease;
        }
        .part-item:hover { border-color: var(--blueprint-accent); }
        .part-item.selected { border-color: #eab308; background: rgba(234, 179, 8, 0.15); box-shadow: 0 0 10px rgba(234, 179, 8, 0.3); }
        .part-item img { max-width: 32px; max-height: 32px; }
        .part-item span { font-size: 7px; margin-top: 2px; color: #94a3b8; }

        @media (min-width: 768px) {
            body { flex-direction: row; }
            #viewer-container { flex: 1; height: 100vh; }
            #catalog-sidebar { flex: 0 0 360px; height: 100vh; border-top: none; border-left: 2px solid var(--blueprint-border); padding: 20px; gap: 10px; }
            .toolbar { grid-template-columns: repeat(2, 1fr); gap: 5px; }
            .toolbar button { padding: 8px 6px; font-size: 10px; }
            .control-group { padding: 8px 10px; font-size: 11px; }
            .customization-section { max-height: 100px; gap: 5px; }
            .custom-btn { padding: 5px; font-size: 10px; }
            .part-list { flex-direction: column; overflow-x: visible; }
            .part-item { width: 100%; height: 55px; flex-direction: row; justify-content: flex-start; gap: 10px; padding-left: 10px; min-width: auto; }
            .part-item img { max-width: 40px; max-height: 40px; }
            .part-item span { font-size: 11px; margin-top: 0; }
        }
    </style>
</head>
<body>

<div class="golden-frame">
    <div class="corner-bottom-left"></div>
    <div class="corner-bottom-right"></div>
</div>

<div class="space-bg"></div>
<div class="cosmic-dust"></div>

<div id="viewer-container"></div>

<div id="catalog-sidebar">
    <div class="header-nav">
        <h3 style="margin: 0; font-size: 12px; color: var(--blueprint-accent); letter-spacing: 1px;">GENERADOR DE PLANO</h3>
        <a href="index.html" class="btn-home">🏠 TEMPLO</a>
    </div>
    
    <div class="toolbar">
        <button id="btn-select" class="active-tool" onclick="setTool('select')">SELECCIONAR</button>
        <button id="btn-translate" onclick="setTool('translate')">MOVER</button>
        <button id="btn-rotate" onclick="setTool('rotate')">ROTAR</button>
        <button class="btn-copy" onclick="copySelectedObject()">COPIAR</button>
        <button class="btn-invert" onclick="invertSelectedObject()">INVERTIR</button>
        <button class="btn-delete" onclick="deleteSelectedObjectInScene()">BORRAR</button>
        <button class="btn-glue" onclick="prepareGlue()" style="background: rgba(153,51,204,0.15);">PEGAR (1)</button>
        <button class="btn-weld" onclick="prepareWeld()" style="background: rgba(255,85,0,0.15);">SOLDAR (2)</button>
        <button class="btn-add" onclick="addSelectedPart()" style="grid-column: span 3; background: rgba(0,170,85,0.15);">AGREGAR PIEZA</button>
    </div>

    <div class="control-group scale-control">
        <label for="scaleSlider" style="margin:0; font-size: 9px; color: var(--blueprint-accent);">ESCALA:</label>
        <input type="range" id="scaleSlider" min="0.5" max="10.0" step="0.1" value="1.0" oninput="updateObjectScale(this.value)">
        <span id="scaleValue" style="font-size: 9px;">1.0x</span>
    </div>

    <details class="control-group">
        <summary>Acabados de Material</summary>
        <div class="customization-section">
            <button class="custom-btn" onclick="applyMaterialFinish('brillante')">✨ Brillante</button>
            <button class="custom-btn" onclick="applyMaterialFinish('invertido')">🔄 Br. Invertido</button>
            <button class="custom-btn" onclick="applyMaterialFinish('envejecido')">🛡️ Envejecido</button>
            <button class="custom-btn" onclick="applyMaterialFinish('metalico')">⚙️ Metálico</button>
        </div>
    </details>

    <details class="control-group">
        <summary>Esquemas de Color (Textura)</summary>
        <div class="customization-section">
            <button class="custom-btn" onclick="applyTextureTint(0xffffff)">Original</button>
            <button class="custom-btn" onclick="applyTextureTint(0xe67300)">Naranja NMS</button>
            <button class="custom-btn" onclick="applyTextureTint(0x6b8e23)">Verde Oliva</button>
            <button class="custom-btn" onclick="applyTextureTint(0xcf3535)">Rojo Alerta</button>
            <button class="custom-btn" onclick="applyTextureTint(0x4a75b5)">Azul Cobalto</button>
            <button class="custom-btn" onclick="applyTextureTint(0xffb700)">Amarillo Oro</button>
            <button class="custom-btn" onclick="applyTextureTint(0x6b4433)">Marrón Cobre</button>
            <button class="custom-btn" onclick="applyTextureTint(0xdcdcdc)">Gris Industrial</button>
        </div>
    </details>

    <div style="font-size: 9px; font-weight: bold; color: var(--blueprint-accent); letter-spacing: 1px;">CATÁLOGO:</div>
    <div class="part-list">
        <div class="part-item" id="item-modelo1" onclick="selectCatalogItem('modelo1', this)"><img src="assets/imagen 1.png"><span>Comp 1</span></div>
        <div class="part-item" id="item-modelo2" onclick="selectCatalogItem('modelo2', this)"><img src="assets/imagen 2.png"><span>Comp 2</span></div>
        <div class="part-item" id="item-modelo3" onclick="selectCatalogItem('modelo3', this)"><img src="assets/imagen 3.png"><span>Comp 3</span></div>
        <div class="part-item" id="item-modelo4" onclick="selectCatalogItem('modelo4', this)"><img src="assets/imagen 4.png"><span>Comp 4</span></div>
        <div class="part-item" id="item-modelo5" onclick="selectCatalogItem('modelo5', this)"><img src="assets/imagen 5.png"><span>Comp 5</span></div>
        <div class="part-item" id="item-modelo6" onclick="selectCatalogItem('modelo6', this)"><img src="assets/B_SHL_E.png"><span>Escudo</span></div>
        <div class="part-item" id="item-modelo7" onclick="selectCatalogItem('modelo7', this)"><img src="assets/cabina_2.png"><span>Cabina 2</span></div>
        <div class="part-item" id="item-modelo8" onclick="selectCatalogItem('modelo8', this)"><img src="assets/alas.png"><span>Alas</span></div>
        <div class="part-item" id="item-modelo9" onclick="selectCatalogItem('modelo9', this)"><img src="assets/torreta.png"><span>Torreta</span></div>
    </div>
</div>

<script>
    const container = document.getElementById('viewer-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 5, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setClearColor(0x000000, 0);
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const transformControls = new THREE.TransformControls(camera, renderer.domElement);
    transformControls.size = 1.5; 
    scene.add(transformControls);

    transformControls.addEventListener('dragging-changed', function (event) {
        controls.enabled = !event.value;
    });

    scene.add(new THREE.AmbientLight(0xffffff, 1.5));

    const textureLoader = new THREE.TextureLoader();

    const materials = {
        'modelo1': new THREE.MeshStandardMaterial({ map: textureLoader.load('assets/cabina_basecolor.JPEG'), normalMap: textureLoader.load('assets/cabina_normal.JPEG'), roughness: 0.5, metalness: 0.2 }),
        'modelo2': new THREE.MeshStandardMaterial({ map: textureLoader.load('assets/sci-fi+cargo+container+3d+model_basecolor.jpg'), normalMap: textureLoader.load('assets/sci-fi+cargo+container+3d+model_normal.jpg'), roughness: 0.5, metalness: 0.2 }),
        'modelo3': new THREE.MeshStandardMaterial({ map: textureLoader.load('assets/spaceship_3d_model_basecolor.JPEG'), normalMap: textureLoader.load('assets/spaceship_3d_model_normal.JPEG'), roughnessMap: textureLoader.load('assets/spaceship_3d_model_roughness.JPEG'), metalnessMap: textureLoader.load('assets/spaceship_3d_model_metallic.JPEG'), roughness: 1.0, metalness: 1.0 }),
        'modelo4': new THREE.MeshStandardMaterial({ map: textureLoader.load('assets/futuristic_train_car_3d_model_basecolor.JPEG'), normalMap: textureLoader.load('assets/futuristic_train_car_3d_model_normal.JPEG'), roughnessMap: textureLoader.load('assets/futuristic_train_car_3d_model_roughness.JPEG'), metalnessMap: textureLoader.load('assets/futuristic_train_car_3d_model_metallic.JPEG'), roughness: 1.0, metalness: 1.0 }),
        'modelo5': new THREE.MeshStandardMaterial({ map: textureLoader.load('assets/sci-fi_spaceship_3d_model_basecolor.JPEG'), normalMap: textureLoader.load('assets/sci-fi_spaceship_3d_model_normal.JPEG'), roughnessMap: textureLoader.load('assets/sci-fi_spaceship_3d_model_roughness.JPEG'), metalnessMap: textureLoader.load('assets/sci-fi_spaceship_3d_model_metallic.JPEG'), roughness: 1.0, metalness: 1.0 }),
        'modelo6': new THREE.MeshStandardMaterial({ 
            map: textureLoader.load('assets/Modelo_3D_de_orbe_de_energía_roja_basecolor.JPEG'), 
            normalMap: textureLoader.load('assets/Modelo_3D_de_orbe_de_energía_roja_normal.JPEG'), 
            roughnessMap: textureLoader.load('assets/Modelo_3D_de_orbe_de_energía_roja_roughness.JPEG'), 
            metalnessMap: textureLoader.load('assets/Modelo_3D_de_orbe_de_energía_roja_metallic.JPEG'), 
            roughness: 1.0, 
            metalness: 1.0 
        }),
        'modelo7': new THREE.MeshStandardMaterial({ 
            map: textureLoader.load('assets/modelo+3D+de+nave+espacial_basecolor.jpg'), 
            normalMap: textureLoader.load('assets/modelo+3D+de+nave+espacial_normal.jpg'), 
            roughnessMap: textureLoader.load('assets/modelo+3D+de+nave+espacial_rm.jpg'), 
            metalnessMap: textureLoader.load('assets/modelo+3D+de+nave+espacial_rm.jpg'), 
            roughness: 1.0, 
            metalness: 1.0 
        }),
        'modelo8': new THREE.MeshStandardMaterial({ 
            map: textureLoader.load('assets/modelo+3D+de+nave+espacial+de+ciencia+ficción_basecolor.jpg'), 
            normalMap: textureLoader.load('assets/modelo+3D+de+nave+espacial+de+ciencia+ficción_normal.jpg'), 
            roughnessMap: textureLoader.load('assets/modelo+3D+de+nave+espacial+de+ciencia+ficción_rm.jpg'), 
            metalnessMap: textureLoader.load('assets/modelo+3D+de+nave+espacial+de+ciencia+ficción_rm.jpg'), 
            roughness: 1.0, 
            metalness: 1.0 
        }),
        'modelo9': new THREE.MeshStandardMaterial({ 
            map: textureLoader.load('assets/Modelo_3D_de_motor_futurista_basecolor.JPEG'), 
            normalMap: textureLoader.load('assets/Modelo_3D_de_motor_futurista_normal.JPEG'), 
            roughnessMap: textureLoader.load('assets/Modelo_3D_de_motor_futurista_roughness.JPEG'), 
            metalnessMap: textureLoader.load('assets/Modelo_3D_de_motor_futurista_metallic.JPEG'), 
            roughness: 1.0, 
            metalness: 1.0 
        })
    };

    const modelCatalog = {
        'modelo1': { path: 'assets/cabina_1.obj', defaultScale: 1.0, rotateY: 0 },
        'modelo2': { path: 'assets/pasillo_1.obj', defaultScale: 2.5, rotateY: 0 },
        'modelo3': { path: 'assets/spaceship_3d_model.obj', defaultScale: 1.5, rotateY: 0 },
        'modelo4': { path: 'assets/futuristic_train_car_3d_model.obj', defaultScale: 1.5, rotateY: 0 },
        'modelo5': { path: 'assets/sci-fi_spaceship_3d_model.obj', defaultScale: 1.5, rotateY: 0 },
        'modelo6': { path: 'assets/modelo6.obj', defaultScale: 1.5, rotateY: 0 },
        'modelo7': { path: 'assets/cabina_2.obj', defaultScale: 1.5, rotateY: 0 },
        'modelo8': { path: 'assets/alas.obj', defaultScale: 1.5, rotateY: 0 },
        'modelo9': { path: 'assets/torreta.obj', defaultScale: 1.5, rotateY: 0 }
    };

    const objLoader = new THREE.OBJLoader();
    let selectedCatalogId = null; 
    let spawnedObjects = [];      
    let selectedSceneObject = null; 
    let currentTool = 'select'; 
    let glueSourceObject = null; 
    let waitingForWeldTarget = false;

    function setTool(tool) {
        currentTool = tool;
        document.querySelectorAll('.toolbar button').forEach(b => {
            if(b.id === 'btn-select' || b.id === 'btn-translate' || b.id === 'btn-rotate') {
                b.classList.remove('active-tool');
            }
        });
        if (tool === 'select') {
            document.getElementById('btn-select').classList.add('active-tool');
            transformControls.enabled = false;
        } else if (tool === 'translate') {
            document.getElementById('btn-translate').classList.add('active-tool');
            transformControls.enabled = true;
            transformControls.setMode('translate');
        } else if (tool === 'rotate') {
            document.getElementById('btn-rotate').classList.add('active-tool');
            transformControls.enabled = true;
            transformControls.setMode('rotate');
        }
    }

    function selectCatalogItem(id, element) {
        selectedCatalogId = id;
        document.querySelectorAll('.part-item').forEach(item => item.classList.remove('selected'));
        element.classList.add('selected');
    }

    function addSelectedPart() {
        if (!selectedCatalogId) { alert("Selecciona una pieza del catálogo."); return; }
        const modelInfo = modelCatalog[selectedCatalogId];
        if (!modelInfo || !modelInfo.path) return;

        objLoader.load(modelInfo.path, function (object) {
            const matToApply = materials[selectedCatalogId] ? materials[selectedCatalogId].clone() : new THREE.MeshStandardMaterial({ color: 0xffffff });
            object.traverse(function (child) {
                if (child.isMesh) child.material = matToApply;
            });
            const s = modelInfo.defaultScale || 1.0;
            object.scale.set(s, s, s);
            object.rotation.y = modelInfo.rotateY || 0;
            object.userData = { catalogId: selectedCatalogId };
            
            const offset = spawnedObjects.length * 0.5;
            object.position.set(offset, 0, 0);

            scene.add(object);
            spawnedObjects.push(object);
            selectObjectInScene(object);
            setTool('translate'); 
        });
    }

    function prepareGlue() {
        if (!selectedSceneObject) { 
            alert("Selecciona primero la pieza que quieres 'pegar' en el visor."); 
            return; 
        }
        glueSourceObject = selectedSceneObject;
        waitingForWeldTarget = false;
        alert("¡Pieza con pegamento lista! Posiciónala donde desees y luego presiona 'SOLDAR'.");
        setTool('translate');
    }

    function prepareWeld() {
        if (!glueSourceObject) {
            alert("Primero debes seleccionar y cargar una pieza con 'PEGAR (1)'.");
            return;
        }
        waitingForWeldTarget = true;
        setTool('select');
        alert("Haz clic en el ítem destino para completar la soldadura.");
    }

    function executeWeld(targetObject) {
        if (!glueSourceObject || targetObject === glueSourceObject) return;

        targetObject.updateMatrixWorld(true);
        const inverseMatrix = new THREE.Matrix4().copy(targetObject.matrixWorld).invert();
        glueSourceObject.applyMatrix4(inverseMatrix);
        
        scene.remove(glueSourceObject);
        targetObject.add(glueSourceObject);
        
        spawnedObjects = spawnedObjects.filter(obj => obj !== glueSourceObject);

        alert("¡Piezas soldadas con éxito!");
        glueSourceObject = null;
        waitingForWeldTarget = false;
        selectObjectInScene(targetObject);
    }

    function copySelectedObject() {
        if (!selectedSceneObject) { alert("Selecciona una pieza en el visor."); return; }
        const clone = selectedSceneObject.clone(true);
        clone.scale.copy(selectedSceneObject.scale);
        clone.rotation.copy(selectedSceneObject.rotation);
        clone.userData = { ...selectedSceneObject.userData };

        clone.traverse(function(child) {
            if(child.isMesh && child.material) {
                child.material = child.material.clone();
            }
        });

        const box = new THREE.Box3().setFromObject(selectedSceneObject);
        const size = new THREE.Vector3();
        box.getSize(size);
        clone.position.copy(selectedSceneObject.position);
        clone.position.z += size.z > 0 ? size.z : 2.0;

        scene.add(clone);
        spawnedObjects.push(clone);
        selectObjectInScene(clone);
        setTool('translate');
    }

    function invertSelectedObject() {
        if (!selectedSceneObject) { alert("Selecciona una pieza para invertir."); return; }
        selectedSceneObject.rotation.y += Math.PI;
    }

    function applyMaterialFinish(type) {
        if (!selectedSceneObject) { alert("Selecciona una pieza primero."); return; }
        selectedSceneObject.traverse(function(child) {
            if (child.isMesh && child.material) {
                if (type === 'brillante') { child.material.roughness = 0.1; child.material.metalness = 0.1; }
                else if (type === 'invertido') { child.material.roughness = 0.3; child.material.metalness = 0.5; }
                else if (type === 'envejecido') { child.material.roughness = 0.8; child.material.metalness = 0.3; }
                else if (type === 'metalico') { child.material.roughness = 0.2; child.material.metalness = 0.9; }
                child.material.needsUpdate = true;
            }
        });
    }

    function applyTextureTint(hexColor) {
        if (!selectedSceneObject) { alert("Selecciona una pieza primero."); return; }
        selectedSceneObject.traverse(function(child) {
            if (child.isMesh && child.material) {
                if (!child.material.color) child.material.color = new THREE.Color();
                child.material.color.setHex(hexColor);
                child.material.needsUpdate = true;
            }
        });
    }

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    renderer.domElement.addEventListener('pointerdown', (event) => {
        if (transformControls.dragging) return;
        const rect = renderer.domElement.getBoundingClientRect();
        mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        
        const intersects = raycaster.intersectObjects(spawnedObjects, true);
        if (intersects.length > 0) {
            let hit = intersects[0].object;
            while (hit.parent && hit.parent !== scene) { hit = hit.parent; }

            if (waitingForWeldTarget && glueSourceObject) {
                if (hit !== glueSourceObject) {
                    executeWeld(hit);
                } else {
                    alert("No puedes soldar la pieza consigo misma. Selecciona otra pieza destino.");
                }
                return;
            }

            if (currentTool === 'select') {
                selectObjectInScene(hit);
            }
        }
    });

    function selectObjectInScene(obj) {
        selectedSceneObject = obj;
        transformControls.attach(obj);
        const currentScale = obj.scale.x;
        document.getElementById('scaleSlider').value = currentScale;
        document.getElementById('scaleValue').innerText = currentScale.toFixed(1) + 'x';
    }

    function updateObjectScale(value) {
        if (!selectedSceneObject) return;
        const s = parseFloat(value);
        selectedSceneObject.scale.set(s, s, s);
        document.getElementById('scaleValue').innerText = s.toFixed(1) + 'x';
    }

    function deleteSelectedObjectInScene() {
        if (!selectedSceneObject) { alert("Selecciona una pieza antes de borrarla."); return; }
        transformControls.detach();
        scene.remove(selectedSceneObject);
        spawnedObjects = spawnedObjects.filter(obj => obj !== selectedSceneObject);
        selectedSceneObject = null;
        setTool('select');
    }

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    });
</script>
</body>
</html>
