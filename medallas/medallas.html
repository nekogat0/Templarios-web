<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logros y Medallas - Templarios del Atlas</title>
    <style>
        body {
            background-color: #050505;
            color: #ffcccc;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding: 20px 10px;
            position: relative;
            overflow-x: hidden;
            min-height: 100vh;
            margin: 0;
            transition: background 1s ease;
        }

        /* Evolución dinámica de fondo según el progreso de medallas */
        body.stage-1 {
            background: radial-gradient(circle at center, #1a0505 0%, #050505 100%);
        }
        body.stage-2 {
            background: radial-gradient(circle at bottom, #2b0c0c 0%, #080303 60%, #020000 100%);
        }
        body.stage-3 {
            background: radial-gradient(circle at 50% 80%, #3a1010 0%, #150505 50%, #030000 100%);
        }
        body.stage-4 {
            background: radial-gradient(circle at center, #4d1414 0%, #200808 40%, #080202 80%, #000000 100%);
        }

        /* Capas de elementos visuales en el fondo */
        .space-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        /* Partículas rojo y dorado */
        .particles {
            position: absolute;
            width: 100%; height: 100%;
            background-image: radial-gradient(circle, #ff3333 1px, transparent 1px), radial-gradient(circle, #ffd700 1px, transparent 1px);
            background-size: 50px 50px, 80px 80px;
            background-position: 0 0, 25px 25px;
            opacity: 0;
            transition: opacity 1s ease;
        }
        body.stage-1 .particles, body.stage-2 .particles, body.stage-3 .particles, body.stage-4 .particles {
            opacity: 0.6;
        }

        /* Contenedor del planeta (fijo abajo) */
        .planet-container {
            position: absolute;
            bottom: -160px;
            left: 50%;
            transform: translateX(-50%);
            width: 420px;
            height: 420px;
            opacity: 0;
            transition: opacity 1.5s ease, transform 1.5s ease;
            pointer-events: none;
        }
        body.stage-2 .planet-container, body.stage-3 .planet-container, body.stage-4 .planet-container {
            opacity: 1;
        }

        /* Planeta rojo principal */
        .planet {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ff4d4d 0%, #7a0000 65%, #1a0000 100%);
            box-shadow: 
                inset -55px -55px 90px rgba(0,0,0,0.95),
                inset 25px 25px 40px rgba(255, 100, 100, 0.15),
                0 0 50px rgba(255, 51, 51, 0.3);
            overflow: hidden;
        }

        /* Capa de tierra / continentes (gira muy lento) */
        .planet-terrain {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%;
            background-image: 
                radial-gradient(ellipse at center, rgba(30, 8, 4, 0.85) 0%, rgba(15, 3, 1, 0.6) 50%, transparent 80%),
                radial-gradient(ellipse at center, rgba(45, 12, 5, 0.75) 0%, rgba(10, 2, 0, 0.5) 45%, transparent 75%),
                radial-gradient(circle, rgba(5, 1, 0, 0.9) 0%, transparent 60%);
            background-size: 260px 200px, 210px 250px, 180px 180px;
            background-position: 20px 40px, 120px 80px, 70px 150px;
            opacity: 0.85;
            animation: panTerrain 65s linear infinite;
        }

        @keyframes panTerrain {
            from { background-position: 20px 40px, 120px 80px, 70px 150px; }
            to { background-position: -340px 40px, -280px 80px, -290px 150px; }
        }

        /* Nubes difusas */
        .planet-clouds {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%;
            background-image: 
                radial-gradient(circle, rgba(255, 255, 255, 0.5) 0%, rgba(255, 255, 255, 0.2) 40%, transparent 75%),
                radial-gradient(circle, rgba(255, 180, 200, 0.45) 0%, rgba(255, 180, 200, 0.15) 50%, transparent 80%),
                radial-gradient(circle, rgba(255, 255, 255, 0.35) 0%, transparent 60%);
            background-size: 180px 140px, 240px 180px, 150px 120px;
            background-position: 0 30px, 0 100px, 0 10px;
            opacity: 0.75;
            animation: panClouds 35s linear infinite;
        }

        @keyframes panClouds {
            from { background-position: 0 30px, 0 100px, 0 10px; }
            to { background-position: -360px 30px, -480px 100px, -300px 10px; }
        }

        /* Lunas y Planetas Lejanos */
        .moon-1, .moon-2, .moon-3, .moon-4, .distant-planet-1, .distant-planet-2 {
            position: absolute;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 1.5s ease;
        }
        
        .moon-1 { width: 40px; height: 40px; top: 30%; left: 20%; background: radial-gradient(circle at 30% 30%, #fff, #b39700 70%, #473c00 100%); box-shadow: inset -5px -5px 10px rgba(0,0,0,0.8), 0 0 15px rgba(255, 215, 0, 0.4); }
        .moon-2 { width: 25px; height: 25px; top: 20%; right: 25%; background: radial-gradient(circle at 30% 30%, #fff, #b39700 70%, #473c00 100%); box-shadow: inset -5px -5px 10px rgba(0,0,0,0.8), 0 0 15px rgba(255, 215, 0, 0.4); }
        .moon-3 { width: 30px; height: 30px; top: 60%; left: 10%; background: radial-gradient(circle at 30% 30%, #e2e8f0, #64748b 70%, #1e293b 100%); box-shadow: inset -4px -4px 8px rgba(0,0,0,0.8), 0 0 10px rgba(100, 116, 139, 0.4); }
        .moon-4 { width: 20px; height: 20px; top: 45%; right: 12%; background: radial-gradient(circle at 30% 30%, #fed7aa, #c2410c 70%, #431407 100%); box-shadow: inset -3px -3px 6px rgba(0,0,0,0.8), 0 0 8px rgba(194, 65, 12, 0.4); }
        
        .distant-planet-1 { width: 65px; height: 65px; top: 15%; left: 8%; background: radial-gradient(circle at 30% 30%, #38bdf8, #0369a1 70%, #0c4a6e 100%); box-shadow: inset -8px -8px 15px rgba(0,0,0,0.9), 0 0 20px rgba(56, 189, 248, 0.25); filter: blur(1px); }
        .distant-planet-2 { width: 50px; height: 50px; top: 25%; right: 8%; background: radial-gradient(circle at 30% 30%, #c084fc, #7e22ce 70%, #3b0764 100%); box-shadow: inset -6px -6px 12px rgba(0,0,0,0.9), 0 0 18px rgba(192, 132, 252, 0.25); filter: blur(1px); }

        body.stage-3 .moon-1, body.stage-3 .moon-2, body.stage-3 .moon-3, body.stage-3 .moon-4, body.stage-3 .distant-planet-1, body.stage-3 .distant-planet-2,
        body.stage-4 .moon-1, body.stage-4 .moon-2, body.stage-4 .moon-3, body.stage-4 .moon-4, body.stage-4 .distant-planet-1, body.stage-4 .distant-planet-2 {
            opacity: 1;
        }

        /* --- ELEMENTOS VISUALES DESPARRAMADOS (ADAPTADOS PARA PC Y MÓVIL) --- */
        .atlas-bg {
            position: absolute;
            top: 15%; left: 50%;
            transform: translateX(-50%) scale(0.8);
            max-width: 380px; width: 45%;
            opacity: 0;
            transition: opacity 2s ease, transform 2s ease;
            pointer-events: none;
            filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.6));
        }
        body.stage-4 .atlas-bg { opacity: 0.45; transform: translateX(-50%) scale(1); }

        .ship-bg {
            position: absolute;
            top: 40%; left: 50%;
            transform: translateX(-50%) scale(0.7);
            max-width: 280px; width: 35%;
            opacity: 0;
            transition: opacity 1.5s ease, transform 1.5s ease;
            pointer-events: none;
            filter: drop-shadow(0 0 15px rgba(255, 77, 77, 0.4));
        }
        body.stage-3 .ship-bg, body.stage-4 .ship-bg { opacity: 0.3; transform: translateX(-50%) scale(1); }

        /* Enjambre (Etapa 1): Esquina superior izquierda */
        .enjambre-bg {
            position: absolute;
            top: 12%; left: 6%;
            max-width: 200px; width: 22%;
            opacity: 0;
            transition: opacity 1s ease;
            pointer-events: none;
            filter: drop-shadow(0 0 12px rgba(255, 100, 100, 0.3));
        }
        body.stage-1 .enjambre-bg, body.stage-2 .enjambre-bg, body.stage-3 .enjambre-bg, body.stage-4 .enjambre-bg {
            opacity: 0.35;
        }

        /* Nave 2 (Etapa 2): Esquina superior derecha */
        .nave2-bg {
            position: absolute;
            top: 15%; right: 7%;
            max-width: 220px; width: 24%;
            opacity: 0;
            transition: opacity 1.5s ease;
            pointer-events: none;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.4));
        }
        body.stage-2 .nave2-bg, body.stage-3 .nave2-bg, body.stage-4 .nave2-bg {
            opacity: 0.4;
        }

        /* Anomalía (Etapa 3): Centro-izquierda / lateral medio */
        .anomalia-bg {
            position: absolute;
            top: 50%; left: 8%;
            transform: translateY(-50%);
            max-width: 240px; width: 25%;
            opacity: 0;
            transition: opacity 1.5s ease;
            pointer-events: none;
            filter: drop-shadow(0 0 20px rgba(100, 200, 255, 0.4));
        }
        body.stage-3 .anomalia-bg, body.stage-4 .anomalia-bg {
            opacity: 0.35;
        }

        /* Extraño (Etapa 4): Centro-derecha / lateral medio */
        .extraño-bg {
            position: absolute;
            top: 52%; right: 8%;
            transform: translateY(-50%);
            max-width: 220px; width: 23%;
            opacity: 0;
            transition: opacity 2s ease;
            pointer-events: none;
            filter: drop-shadow(0 0 20px rgba(255, 50, 150, 0.45));
        }
        body.stage-4 .extraño-bg {
            opacity: 0.4;
        }

        /* Efecto CRT */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 999;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 15px;
            color: #ff3333;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9em;
            text-shadow: 0 0 8px rgba(255, 51, 51, 0.7);
            border: 1px solid #ff3333;
            padding: 6px 12px;
            border-radius: 5px;
            transition: all 0.3s ease;
            position: relative;
            z-index: 10;
        }
        .back-link:hover {
            background-color: #ff3333;
            color: #050505;
            box-shadow: 0 0 15px rgba(255, 51, 51, 1);
        }

        h1 {
            font-size: 1.6em;
            margin: 10px 0;
            position: relative;
            z-index: 10;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5), 0 0 20px rgba(255, 51, 51, 0.4);
        }

        p {
            font-size: 0.95em;
            position: relative;
            z-index: 10;
            margin: 5px 0 15px 0;
            color: #ffcccc;
            text-shadow: 0 0 5px rgba(255, 51, 51, 0.4);
        }

        #stats-info span {
            color: #ffd700;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.7);
        }

        .medals-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
            position: relative;
            z-index: 10;
        }

        .medal-card {
            background: rgba(10, 5, 5, 0.6);
            backdrop-filter: blur(4px);
            border: 2px solid rgba(255, 51, 51, 0.6);
            border-radius: 10px;
            padding: 10px;
            width: 130px;
            box-shadow: 0 0 12px rgba(255, 51, 51, 0.25), 
                        inset 0 0 8px rgba(255, 51, 51, 0.15);
            transition: all 0.3s ease;
            position: relative;
            cursor: pointer;
        }

        .medal-card:hover {
            transform: scale(1.05);
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5), 
                        inset 0 0 12px rgba(255, 215, 0, 0.3);
        }

        .medal-card::before, .medal-card::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            border-color: #ffd700;
            border-style: solid;
        }
        .medal-card::before { top: -2px; left: -2px; border-width: 2px 0 0 2px; }
        .medal-card::after { bottom: -2px; right: -2px; border-width: 0 2px 2px 0; }

        .medal-card img {
            width: 75px;
            height: 75px;
            object-fit: contain;
            filter: grayscale(100%) brightness(30%);
            transition: filter 0.3s ease;
        }

        .medal-title {
            margin-top: 6px;
            font-weight: bold;
            font-size: 0.95em;
            color: #885555;
        }

        .medal-requirement {
            margin-top: 4px;
            font-size: 0.75em;
            color: #885555;
        }

        .medal-card.unlocked img {
            filter: grayscale(0%) brightness(100%);
            filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.8));
        }
        .medal-card.unlocked .medal-title {
            color: #ffd700;
            text-shadow: 0 0 6px rgba(255, 215, 0, 0.6);
        }
        .medal-card.unlocked .medal-requirement {
            color: #ffcccc;
        }

        /* --- VENTANA MODAL PERSONALIZADA --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-box {
            background: rgba(15, 5, 5, 0.85);
            border: 2px solid #ffd700;
            border-radius: 12px;
            padding: 25px;
            width: 85%;
            max-width: 400px;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.4), inset 0 0 15px rgba(255, 51, 51, 0.3);
            text-align: center;
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-box { transform: scale(1); }

        .modal-box h3 {
            color: #ffd700;
            font-size: 1.1em;
            margin-top: 0;
            margin-bottom: 15px;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
        }

        .modal-box p {
            color: #ffcccc;
            font-size: 0.9em;
            line-height: 1.5;
            margin-bottom: 20px;
            white-space: pre-line;
            text-shadow: none;
        }

        .modal-btn {
            background: transparent;
            color: #ffd700;
            border: 1px solid #ffd700;
            padding: 8px 20px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.3);
        }

        .modal-btn:hover {
            background: #ffd700;
            color: #050505;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
        }

        /* --- MEDIA QUERY PARA MÓVILES (Mantiene posiciones compactas) --- */
        @media (max-width: 768px) {
            .medals-container { gap: 10px; }
            .medal-card { width: 115px; padding: 8px; }
            .medal-card img { width: 65px; height: 65px; }
            
            /* Reacomodar en móvil para que no se amontonen feo */
            .enjambre-bg { top: 10%; left: 5%; max-width: 120px; }
            .nave2-bg { top: 15%; right: 5%; max-width: 130px; }
            .anomalia-bg { top: 35%; left: 4%; max-width: 130px; }
            .extraño-bg { top: 60%; right: 4%; max-width: 120px; }
            .ship-bg, .atlas-bg { max-width: 180px; }
            
            .planet-container {
                width: 340px;
                height: 340px;
                bottom: -130px;
            }
            .moon-3, .moon-4, .distant-planet-1, .distant-planet-2 { display: none; }
        }
    </style>
</head>
<body>

    <!-- Elementos dinámicos del fondo espacial -->
    <div class="space-bg">
        <!-- Elementos distribuidos por toda la pantalla -->
        <img src="medallas/enjambre.png" alt="Enjambre" class="enjambre-bg">
        <img src="medallas/nave2.png" alt="Nave Secundaria" class="nave2-bg">
        <img src="medallas/anomalia.png" alt="Anomalía Espacial" class="anomalia-bg">
        <img src="medallas/extraño.png" alt="Objeto Extraño" class="extraño-bg">
        
        <!-- Recursos centrales -->
        <img src="medallas/atlas.png" alt="Atlas de fondo" class="atlas-bg">
        <img src="medallas/nave.png" alt="Nave de fondo" class="ship-bg">
        
        <!-- Lunas y planetas distantes -->
        <div class="moon-1"></div>
        <div class="moon-2"></div>
        <div class="moon-3"></div>
        <div class="moon-4"></div>
        <div class="distant-planet-1"></div>
        <div class="distant-planet-2"></div>
        
        <!-- Planeta oceánico rojo -->
        <div class="planet-container">
            <div class="planet">
                <div class="planet-terrain"></div>
                <div class="planet-clouds"></div>
            </div>
        </div>
        <div class="particles"></div>
    </div>

    <!-- Ventana Modal Personalizada -->
    <div class="modal-overlay" id="customModal">
        <div class="modal-box">
            <h3 id="modalTitle">⚡ [TEMPLARIOS DEL ATLAS] ⚡</h3>
            <p id="modalMessage">Mensaje aquí...</p>
            <button class="modal-btn" onclick="cerrarModal()">ACEPTAR</button>
        </div>
    </div>

    <a href="misiones.html" class="back-link">← Volver a Misiones</a>

    <h1>Medallas de Misiones</h1>
    <p id="stats-info">Misiones completadas: <span id="total-count">0</span></p>
    <p>Reclama tus medallas bajo la ley de los Templarios del Atlas.</p>

    <div class="medals-container">
        <!-- Medalla 4 (10 misiones) -->
        <div class="medal-card" id="medal-4" data-missions="10" onclick="intentarDesbloquear(this, 10, 4)">
            <img src="medallas/4.png" alt="Medalla">
            <div class="medal-title">Medalla</div>
            <div class="medal-requirement">10 misiones</div>
        </div>

        <!-- Medalla 3 (25 misiones) -->
        <div class="medal-card" id="medal-3" data-missions="25" onclick="intentarDesbloquear(this, 25, 3)">
            <img src="medallas/3.png" alt="Medalla">
            <div class="medal-requirement">25 misiones</div>
        </div>

        <!-- Medalla 2 (50 misiones) -->
        <div class="medal-card" id="medal-2" data-missions="50" onclick="intentarDesbloquear(this, 50, 2)">
            <img src="medallas/2.png" alt="Medalla">
            <div class="medal-requirement">50 misiones</div>
        </div>

        <!-- Medalla 1 (100 misiones) -->
        <div class="medal-card" id="medal-1" data-missions="100" onclick="intentarDesbloquear(this, 100, 1)">
            <img src="medallas/1.png" alt="Medalla">
            <div class="medal-title">Medalla</div>
            <div class="medal-requirement">100 misiones</div>
        </div>
    </div>

    <script>
        let misionesActuales = parseInt(localStorage.getItem('templarios_misiones_totales') || '0');
        document.getElementById('total-count').innerText = misionesActuales;

        function cargarMedallasGuardadas() {
            let medallasDesbloqueadas = JSON.parse(localStorage.getItem('templarios_medallas_desbloqueadas')) || [];
            medallasDesbloqueadas.forEach(nivel => {
                const card = document.getElementById(`medal-${nivel}`);
                if (card) {
                    card.classList.add('unlocked');
                }
            });
            actualizarFondoVisual();
        }

        function mostrarModal(titulo, mensaje) {
            document.getElementById('modalTitle').innerText = titulo;
            document.getElementById('modalMessage').innerText = mensaje;
            document.getElementById('customModal').classList.add('active');
        }

        function cerrarModal() {
            document.getElementById('customModal').classList.remove('active');
        }

        function intentarDesbloquear(card, requisito, nivelMedalla) {
            if (misionesActuales >= requisito) {
                if (!card.classList.contains('unlocked')) {
                    card.classList.add('unlocked');
                    let medallasDesbloqueadas = JSON.parse(localStorage.getItem('templarios_medallas_desbloqueadas')) || [];
                    if (!medallasDesbloqueadas.includes(nivelMedalla)) {
                        medallasDesbloqueadas.push(nivelMedalla);
                        localStorage.setItem('templarios_medallas_desbloqueadas', JSON.stringify(medallasDesbloqueadas));
                    }
                }
                
                actualizarFondoVisual();

                let mensaje = "";
                if (nivelMedalla === 4) {
                    mensaje = "Felicidades. Has demostrado tu valía y has sido reconocido oficialmente como Templario bajo la ley suprema.";
                } else if (nivelMedalla === 3) {
                    mensaje = "Tu senda ha sido honrada. Has sido reconocido como un alma ejemplar, un baluarte inquebrantable en estos sistemas.";
                } else if (nivelMedalla === 2) {
                    mensaje = "El alto mando lo proclama: Tu escuadrón y la flota entera están orgullosos de tener a un capitán tan legendario como tú.";
                } else if (nivelMedalla === 1) {
                    mensaje = "Los Templarios se inclinan ante tu grandeza. Te agradecemos por tu ayuda eterna; eres un ser verdaderamente ejemplar entre los seres de este cosmos.";
                }
                
                mostrarModal("⚡ [TEMPLARIOS DEL ATLAS] ⚡", mensaje);
            } else {
                let mensajeFalta = "Te faltan misiones para reclamar esta investidura.\nTienes " + misionesActuales + " y se exigen " + requisito + ".";
                mostrarModal("⚠️ [ACCESO DENEGADO] ⚠️", mensajeFalta);
            }
        }

        function actualizarFondoVisual() {
            const tarjetas = document.querySelectorAll('.medal-card');
            let desbloqueadas = 0;
            tarjetas.forEach(t => {
                if (t.classList.contains('unlocked')) desbloqueadas++;
            });

            document.body.classList.remove('stage-1', 'stage-2', 'stage-3', 'stage-4');
            if (desbloqueadas >= 4) {
                document.body.classList.add('stage-4');
            } else if (desbloqueadas === 3) {
                document.body.classList.add('stage-3');
            } else if (desbloqueadas === 2) {
                document.body.classList.add('stage-2');
            } else if (desbloqueadas === 1) {
                document.body.classList.add('stage-1');
            }
        }

        cargarMedallasGuardadas();
    </script>

</body>
</html>
