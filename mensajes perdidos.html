        :root {
            --atlas-gold: #d4af37;
            --atlas-gold-dim: #854d0e;
            --atlas-red: #8b0000;
            --atlas-red-dark: #b91c1c;
            --atlas-bg: #020203;
            --atlas-panel: #060608;
            --atlas-border: rgba(212, 175, 55, 0.3);
            --atlas-glow: rgba(212, 175, 55, 0.15);
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            font-family: 'Share Tech Mono', 'Courier New', Courier, monospace;
            background-color: var(--atlas-bg);
            color: #e2e8f0;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-x: hidden;
        }

        /* Fondo cósmico y partículas estelares de Brújula */
        .space-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 50% 50%, #110c1d 0%, #020203 100%);
            z-index: -3;
        }

        .cosmic-dust {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: 
                radial-gradient(white 1px, transparent 0),
                radial-gradient(rgba(212, 175, 55, 0.5) 1px, transparent 0);
            background-size: 50px 50px, 80px 80px;
            background-position: 0 0, 25px 35px;
            opacity: 0.25;
            animation: driftDust 60s linear infinite;
            z-index: -2;
            pointer-events: none;
        }

        @keyframes driftDust {
            0% { transform: translateY(0); }
            100% { transform: translateY(-800px); }
        }

        /* Efecto CRT / Líneas de escaneo */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 999;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
        }

        /* Marco dorado y esquinas técnicas de Brújula */
        .golden-frame {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border: 1px solid var(--atlas-border);
            pointer-events: none;
            z-index: 10;
        }

        .golden-frame::before, .golden-frame::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border-color: var(--atlas-gold);
            border-style: solid;
        }

        .golden-frame::before {
            top: 0; left: 0;
            border-width: 2px 0 0 2px;
        }

        .golden-frame::after {
            top: 0; right: 0;
            border-width: 2px 2px 0 0;
        }

        .frame-bottom-corners {
            position: fixed;
            bottom: 10px;
            left: 10px;
            right: 10px;
            height: 20px;
            pointer-events: none;
            z-index: 10;
        }

        .frame-bottom-corners::before, .frame-bottom-corners::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border-color: var(--atlas-gold);
            border-style: solid;
        }

        .frame-bottom-corners::before {
            bottom: 0; left: 0;
            border-width: 0 0 2px 2px;
        }

        .frame-bottom-corners::after {
            bottom: 0; right: 0;
            border-width: 0 2px 2px 0;
        }

        .container {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            z-index: 1;
            position: relative;
        }
        .back-btn {

        }

        }
        @keyframes glowBlink {
            0% { opacity: 0.4; text-shadow: 0 0 2px #ff0033; }
            100% { opacity: 1; text-shadow: 0 0 12px #ff0033, 0 0 22px #ff0033; }
        }

            background-color: #030304;
            border: 1px solid #1a0505;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;

            font-size: 0.9em;
            line-height: 1.4;
        }
        .msg.user {
            background-color: #3b0a0a;

            border-bottom-left-radius: 2px;
            border-left: 3px solid #d4af37;
            border-top: 1px solid #1a0505;
            border-right: 1px solid #1a0505;

        }

            color: #d4af37;
            margin-bottom: 4px;

        let currentNPC = null;
        let interactionCounter = 0;
        const maxInteractionsBeforeCollapse = 6;

        function initSession() {
            let activeChannel = JSON.parse(localStorage.getItem('templarios_active_channel'));
            let savedCounter = localStorage.getItem('templarios_counter');
            
            if (savedCounter) {
                interactionCounter = parseInt(savedCounter);
            }

            if (!activeChannel) {
                selectRandomNPC();
            } else {
                currentNPC = activeChannel;
                document.getElementById('npcName').innerText = currentNPC.name;
                loadChatHistory();
            }

            const inputField = document.getElementById('userInput');
            inputField.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });
        }

        function selectRandomNPC() {
            currentNPC = npcsPool[Math.floor(Math.random() * npcsPool.length)];
            document.getElementById('npcName').innerText = currentNPC.name;
            interactionCounter = 0;
            localStorage.setItem('templarios_counter', 0);
            localStorage.setItem('templarios_active_channel', JSON.stringify(currentNPC));
            
            let historyKey = 'chat_' + currentNPC.id;
            let initialMsg = { 
                sender: 'npc', 
                text: "Alerta de auxilio en el sector... s-soporte vital fallando... ¿Hay alguien al otro lado de la estática...?", 
                time: getFormattedTime() 
            };
            
            localStorage.setItem(historyKey, JSON.stringify([initialMsg]));
            loadChatHistory();
            appendSystemLog(`> [SEÑAL INESTABLE DETECTADA] Conectado con: ${currentNPC.name}`);
        }

        function loadChatHistory() {
            const chatHistory = document.getElementById('chatHistory');
            chatHistory.innerHTML = '';
            let historyKey = 'chat_' + currentNPC.id;
            let history = JSON.parse(localStorage.getItem(historyKey)) || [];

            history.forEach(msg => {
                const div = document.createElement('div');
                div.className = msg.sender === 'user' ? 'msg user' : 'msg npc';
                div.innerHTML = `<span class="msg-meta">${msg.sender === 'user' ? 'Tú' : currentNPC.name} • ${msg.time}</span>${escapeHtml(msg.text)}`;
                chatHistory.appendChild(div);
            });
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            interactionCounter++;
            localStorage.setItem('templarios_counter', interactionCounter);

            const timeStr = getFormattedTime();
            let historyKey = 'chat_' + currentNPC.id;
            let history = JSON.parse(localStorage.getItem(historyKey)) || [];

            history.push({ sender: 'user', text: text, time: timeStr });
            localStorage.setItem(historyKey, JSON.stringify(history));

            input.value = '';
            loadChatHistory();

            if (interactionCounter >= maxInteractionsBeforeCollapse) {
                setTimeout(() => {
                    let dropMsg = "Sin respuesta del interlocutor... [///] El flujo de datos se interrumpe... Cerrando subrutina de enlace local... --kzzzt--";
                    history.push({ sender: 'npc', text: dropMsg, time: getFormattedTime() });
                    localStorage.setItem(historyKey, JSON.stringify(history));
                    loadChatHistory();
                    appendSystemLog("> [ADVERTENCIA] Conexión perdida con el sector.");

                    setTimeout(() => {
                        appendSystemLog("> Señal inestable / Buscando nueva frecuencia estelar...");
                        setTimeout(() => {
                            localStorage.removeItem('templarios_active_channel');
                            localStorage.removeItem('templarios_counter');
                            selectRandomNPC();
                        }, 3000);
                    }, 180000);
                }, 1000);
                return;
            }

            appendSystemLog("> Sintonizando frecuencia y decodificando respuesta...");

            setTimeout(() => {
                let aiResponse = generateRadioResponse(text);
                history.push({ sender: 'npc', text: aiResponse, time: getFormattedTime() });
                localStorage.setItem(historyKey, JSON.stringify(history));
                loadChatHistory();
            }, 800);
        }

        function generateRadioResponse(userMessage) {
            let chosen = baseRepliesExpanded[Math.floor(Math.random() * baseRepliesExpanded.length)];
            return applyRadioStatic(chosen);
        }

        function applyRadioStatic(text) {
            const staticSnippets = [" [///] ", " ... ", " --kzzzt-- ", "... "];
            let words = text.split(" ");
            let result = "";

            for (let i = 0; i < words.length; i++) {
                result += words[i];
                if (Math.random() < 0.25 && i < words.length - 1) {
                    result += staticSnippets[Math.floor(Math.random() * staticSnippets.length)];
                } else {
                    result += " ";
                }
            }
            return result + " --kzzzt--";
        }

        function appendSystemLog(text) {
            const chatHistory = document.getElementById('chatHistory');
            const div = document.createElement('div');
            div.className = 'log-system';
            div.innerText = text;
            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        function getFormattedTime() {
            const now = new Date();
            return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        initSession();
    </script>
