<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Templarios del Atlas | Holo-Reproductor de Beats</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&family=Share+Tech+Mono&display=swap');

    :root {
      --bg-dark: #010103;
      --player-bg: rgba(6, 9, 16, 0.95);
      --neon-red: #ff004c;
      --neon-gold: #ffaa00;
      --neon-green: #00ff66;
      --glow-red: 0 0 25px rgba(255, 0, 76, 0.9), inset 0 0 15px rgba(255, 0, 76, 0.5);
      --glow-gold: 0 0 15px rgba(255, 170, 0, 0.6);
      --glow-green: 0 0 18px rgba(0, 255, 102, 0.7);
      --text-main: #f2e3c6;
      --border-hud: rgba(255, 170, 0, 0.3);
    }

    /* ESTILOS DE TEMA 1: GEEK CYBERPUNK AZÚCAR */
    body.theme-1 {
      --bg-dark: #020813;
      --player-bg: rgba(4, 15, 30, 0.96);
      --neon-red: #00e5ff;
      --neon-gold: #7000ff;
      --glow-red: 0 0 25px rgba(0, 229, 255, 0.9), inset 0 0 15px rgba(0, 229, 255, 0.5);
      --glow-gold: 0 0 15px rgba(112, 0, 255, 0.6);
      --text-main: #c6f2ff;
      --border-hud: rgba(0, 229, 255, 0.4);
    }

    /* ESTILOS DE TEMA 2: MATRIZ VERDE TÁCTICA */
    body.theme-2 {
      --bg-dark: #010802;
      --player-bg: rgba(5, 18, 8, 0.96);
      --neon-red: #00ff66;
      --neon-gold: #aaff00;
      --glow-red: 0 0 25px rgba(0, 255, 102, 0.9), inset 0 0 15px rgba(0, 255, 102, 0.5);
      --glow-gold: 0 0 15px rgba(170, 255, 0, 0.6);
      --text-main: #c6ffe2;
      --border-hud: rgba(0, 255, 102, 0.4);
    }

    /* ESTILOS DE TEMA 3: MODO ALERTA ROJA EXTREMA */
    body.theme-3 {
      --bg-dark: #0d0101;
      --player-bg: rgba(22, 5, 5, 0.96);
      --neon-red: #ff2a00;
      --neon-gold: #ffbb00;
      --glow-red: 0 0 30px rgba(255, 42, 0, 1), inset 0 0 20px rgba(255, 42, 0, 0.7);
      --glow-gold: 0 0 20px rgba(255, 187, 0, 0.8);
      --text-main: #ffccc6;
      --border-hud: rgba(255, 42, 0, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 25px;
      position: relative;
      overflow-x: hidden;
      transition: background 0.3s ease;
    }

    /* MARCO CRT EXTERIOR CON ESQUINAS EN L */
    .screen-frame {
      position: fixed;
      top: 10px; left: 10px; right: 10px; bottom: 10px;
      border: 2px solid var(--neon-red);
      box-shadow: var(--glow-red);
      pointer-events: none;
      z-index: 998;
      transition: border 0.3s, box-shadow 0.3s;
    }

    .screen-corner {
      position: absolute;
      width: 18px; height: 18px;
      border: 2px solid var(--neon-gold);
      box-shadow: 0 0 10px var(--neon-gold);
      background: transparent;
      transition: border 0.3s, box-shadow 0.3s;
    }
    .sc-tl { top: -2px; left: -2px; border-right: none; border-bottom: none; }
    .sc-tr { top: -2px; right: -2px; border-left: none; border-bottom: none; }
    .sc-bl { bottom: -2px; left: -2px; border-right: none; border-top: none; }
    .sc-br { bottom: -2px; right: -2px; border-left: none; border-top: none; }

    /* LÍNEAS DE ESCANEO CRT Y EFECTO PARPADEO */
    body::before {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%), 
                  linear-gradient(90deg, rgba(255, 0, 76, 0.04), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.04));
      z-index: 999;
      background-size: 100% 4px, 4px 100%;
      pointer-events: none;
    }

    body::after {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: rgba(255, 0, 76, 0.04);
      opacity: 0;
      z-index: 1000;
      pointer-events: none;
      animation: crtFlicker 0.12s infinite;
    }

    @keyframes crtFlicker {
      0% { opacity: 0.03; }
      50% { opacity: 0.08; }
      100% { opacity: 0.03; }
    }

    .runic-text {
      font-family: 'Share Tech Mono', monospace !important;
      color: var(--neon-gold) !important;
      letter-spacing: 1.5px;
      text-shadow: 0 0 8px rgba(255, 170, 0, 0.8);
      text-transform: uppercase;
    }

    /* SELECTOR DE ESTILOS RÁPIDO EN ESQUINAS */
    .style-switcher {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 6px;
      z-index: 1005;
      background: rgba(0, 0, 0, 0.6);
      padding: 6px;
      border: 1px solid var(--border-hud);
      border-radius: 4px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    .btn-style {
      background: rgba(255, 170, 0, 0.1);
      border: 1px solid var(--neon-gold);
      color: var(--neon-gold);
      width: 24px; height: 24px;
      font-size: 0.65rem;
      font-family: 'Orbitron', sans-serif;
      font-weight: bold;
      cursor: pointer;
      border-radius: 3px;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.2s;
    }

    .btn-style:hover, .btn-style.active-theme {
      background: var(--neon-gold);
      color: #000;
      box-shadow: var(--glow-gold);
    }

    /* CONTENEDOR PRINCIPAL TIPO HUD */
    .audio-player-card {
      background: var(--player-bg);
      border: 1px solid var(--border-hud);
      border-radius: 8px;
      padding: 25px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 0 35px rgba(255, 0, 76, 0.25);
      position: relative;
      z-index: 2;
      transition: background 0.3s, border 0.3s;
    }

    /* ESQUINAS INTERIORES EN L */
    .hud-corner { position: absolute; width: 8px; height: 8px; border: 2px solid var(--neon-gold); pointer-events: none; z-index: 12; background: transparent; }
    .c1 { top: -2px; left: -2px; border-right: none; border-bottom: none; }
    .c2 { top: -2px; right: -2px; border-left: none; border-bottom: none; }
    .c3 { bottom: -2px; left: -2px; border-right: none; border-top: none; }
    .c4 { bottom: -2px; right: -2px; border-left: none; border-top: none; }

    .player-header {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      color: #fff;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-hud);
      padding-bottom: 6px;
    }

    .player-header span.led {
      background: var(--neon-red);
      width: 10px; height: 10px;
      border-radius: 2px;
      box-shadow: var(--glow-red);
    }

    /* INFORMACIÓN DE LA PISTA */
    .track-info {
      text-align: center;
      margin-bottom: 15px;
      background: rgba(255, 0, 76, 0.03);
      border: 1px solid rgba(255, 0, 76, 0.2);
      padding: 10px;
      border-radius: 4px;
      position: relative;
    }

    .btn-fav-track {
      position: absolute;
      top: 10px;
      right: 10px;
      background: transparent;
      border: none;
      color: rgba(255,255,255,0.3);
      font-size: 1.2rem;
      cursor: pointer;
      transition: color 0.2s;
    }
    .btn-fav-track.is-fav {
      color: var(--neon-gold);
      text-shadow: var(--glow-gold);
    }

    .track-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.05rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 10px rgba(255,255,255,0.4);
      margin-bottom: 4px;
    }

    .track-artist {
      font-size: 0.8rem;
      color: var(--neon-gold);
      letter-spacing: 1px;
    }

    /* MATRIZ DE RITMOS ESTILO NMS */
    .nms-beat-matrix {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 3px;
      margin: 8px 0 12px 0;
      background: rgba(0,0,0,0.6);
      border: 1px dashed var(--border-hud);
      padding: 4px;
      border-radius: 4px;
    }

    .beat-node {
      height: 10px;
      background: rgba(255, 170, 0, 0.05);
      border: 1px solid rgba(255, 170, 0, 0.2);
      border-radius: 2px;
      transition: all 0.1s ease;
    }

    .beat-node.active-step {
      background: var(--neon-red);
      border-color: #fff;
      box-shadow: var(--glow-red);
    }

    /* VISUALIZADOR DE BARRAS */
    .visualizer {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 3px;
      height: 30px;
      margin-bottom: 15px;
    }

    .bar {
      flex: 1;
      background: var(--neon-gold);
      box-shadow: var(--glow-gold);
      height: 10%;
      transition: height 0.1s ease;
    }

    /* BARRA DE PROGRESO */
    .progress-container {
      margin-bottom: 15px;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,170,0,0.2);
    }

    .progress-filled {
      height: 100%;
      width: 0%;
      background: var(--neon-red);
      box-shadow: var(--glow-red);
    }

    .time-codes {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.6);
      margin-top: 4px;
      font-family: 'Share Tech Mono', monospace;
    }

    /* CONTROLES EXTRAS */
    .extra-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      background: rgba(0,0,0,0.3);
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px solid rgba(255,170,0,0.15);
    }

    .toggle-sub-btn {
      background: transparent;
      border: 1px solid rgba(255,170,0,0.3);
      color: rgba(255,255,255,0.6);
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 3px;
      cursor: pointer;
      font-family: 'Orbitron', sans-serif;
      transition: all 0.2s;
    }

    .toggle-sub-btn.active {
      background: rgba(255,0,76,0.2);
      border-color: var(--neon-red);
      color: #fff;
      box-shadow: var(--glow-red);
    }

    .volume-box {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .volume-box span {
      font-size: 0.8rem;
      cursor: pointer;
    }

    .volume-slider {
      width: 80px;
      accent-color: var(--neon-red);
      cursor: pointer;
    }

    /* CONTROLES PRINCIPALES (SIN BOTONES DE +/-10S) */
    .player-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-bottom: 15px;
    }

    .btn-control {
      background: rgba(255, 170, 0, 0.1);
      border: 1px solid var(--neon-gold);
      color: var(--neon-gold);
      width: 42px; height: 42px;
      border-radius: 50%;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: var(--glow-gold);
      transition: all 0.2s ease;
    }

    .btn-control:hover {
      background: var(--neon-gold);
      color: #000;
      transform: scale(1.08);
    }

    .btn-play {
      width: 52px; height: 52px;
      background: rgba(255, 0, 76, 0.2);
      border-color: var(--neon-red);
      color: #fff;
      box-shadow: var(--glow-red);
      font-size: 1.1rem;
    }

    .btn-play:hover {
      background: var(--neon-red);
      color: #000;
    }

    /* PESTAÑAS DE LISTAS */
    .list-tabs {
      display: flex;
      gap: 5px;
      margin-bottom: 8px;
    }

    .tab-btn {
      flex: 1;
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--border-hud);
      color: rgba(255,255,255,0.6);
      font-size: 0.7rem;
      padding: 5px;
      font-family: 'Orbitron', sans-serif;
      cursor: pointer;
      border-radius: 3px;
      text-align: center;
      transition: all 0.2s;
    }

    .tab-btn.active-tab {
      background: rgba(255,170,0,0.15);
      border-color: var(--neon-gold);
      color: #fff;
      font-weight: bold;
    }

    .playlist-container {
      border-top: 1px solid var(--border-hud);
      padding-top: 10px;
      max-height: 140px;
      overflow-y: auto;
    }

    .playlist-section {
      display: none;
    }
    .playlist-section.active-section {
      display: block;
    }

    .playlist-item {
      padding: 6px 8px;
      font-size: 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s;
      margin-bottom: 3px;
      color: rgba(255,255,255,0.7);
    }

    .playlist-item:hover {
      background: rgba(255, 170, 0, 0.1);
      color: #fff;
    }

    .playlist-item.active {
      background: rgba(255, 0, 76, 0.15);
      border-left: 3px solid var(--neon-red);
      color: #fff;
      font-weight: bold;
    }

    .empty-notice {
      text-align: center;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.4);
      padding: 15px;
      font-style: italic;
    }

    .nav-back {
      display: block;
      text-align: center;
      margin-top: 12px;
      color: var(--neon-gold);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      text-decoration: none;
      letter-spacing: 1px;
    }
    .nav-back:hover { text-decoration: underline; }
  </style>
</head>

    Tu navegador no soporta elementos de audio.

  <script>
    const audioElement = document.getElementById('audioElement');
    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const trackTitle = document.getElementById('trackTitle');
    const trackArtist = document.getElementById('trackArtist');
    const progressBar = document.getElementById('progressBar');
    const progressFilled = document.getElementById('progressFilled');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const allPlaylistItems = document.querySelectorAll('#sectionPlaylist .playlist-item');
    const bars = document.querySelectorAll('.bar');
    const beatNodes = document.querySelectorAll('.beat-node');

    const shuffleBtn = document.getElementById('shuffleBtn');
    const loopBtn = document.getElementById('loopBtn');
    const muteBtn = document.getElementById('muteBtn');
    const volumeSlider = document.getElementById('volumeSlider');
    const favToggleBtn = document.getElementById('favToggleBtn');
    const sectionHistory = document.getElementById('sectionHistory');
    const emptyHistory = document.getElementById('emptyHistory');
    const sectionFavorites = document.getElementById('sectionFavorites');
    const emptyFavorites = document.getElementById('emptyFavorites');

    let currentTrackIndex = 0;
    let isPlaying = false;
    let activeStep = 0;
    let isShuffle = false;
    let isLoop = false;
    let previousVolume = 1;
    let favoritesList = [];
    let historyList = [];

    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playSfx() {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.04);
        
        gain.gain.setValueAtTime(0.05, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
        
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.04);
      } catch (e) {}
    }

    document.querySelectorAll('button, input[type="range"], .playlist-item').forEach(el => {
      el.addEventListener('click', () => playSfx());
    });

    function setTheme(themeNumber) {
      document.body.className = themeNumber === 0 ? '' : `theme-${themeNumber}`;
      document.querySelectorAll('.btn-style').forEach((btn, idx) => {
        if (idx === themeNumber) btn.classList.add('active-theme');
        else btn.classList.remove('active-theme');
      });
    }

    function loadTrack(index) {
      const item = allPlaylistItems[index];
      const src = item.getAttribute('data-src');
      const title = item.getAttribute('data-title');
      const artist = item.getAttribute('data-artist');

      audioElement.src = src;
      audioElement.load();
      trackTitle.innerText = title;
      trackArtist.innerText = artist;

      currentTrackIndex = index;

      allPlaylistItems.forEach(el => el.classList.remove('active'));
      allPlaylistItems[index].classList.add('active');

      updateFavButtonState();
      addToHistory(title, src);
    }

    function togglePlay() {
      if (isPlaying) {
        audioElement.pause();
        playBtn.innerText = "▶";
        isPlaying = false;
      } else {
        audioElement.play().then(() => {
          playBtn.innerText = "⏸";
          isPlaying = true;
        }).catch(error => {
          console.error("Error al reproducir el archivo de audio:", error);
          alert("No se pudo reproducir la pista. Revisa que el archivo exista en la carpeta 'musica'.");
          playBtn.innerText = "▶";
          isPlaying = false;
        });
      }
    }

    playBtn.addEventListener('click', togglePlay);

    allPlaylistItems.forEach((item, index) => {
      item.addEventListener('click', () => {
        loadTrack(index);
        audioElement.play().then(() => {
          playBtn.innerText = "⏸";
          isPlaying = true;
        }).catch(err => console.log("Error en selección:", err));
      });
    });

    function getNextIndex() {
      if (isShuffle) {
        let rand;
        do {
          rand = Math.floor(Math.random() * allPlaylistItems.length);
        } while (rand === currentTrackIndex && allPlaylistItems.length > 1);
        return rand;
      } else {
        return (currentTrackIndex + 1) % allPlaylistItems.length;
      }
    }

    nextBtn.addEventListener('click', () => {
      if (isLoop) {
        audioElement.currentTime = 0;
        if (isPlaying) audioElement.play();
      } else {
        currentTrackIndex = getNextIndex();
        loadTrack(currentTrackIndex);
        if (isPlaying) audioElement.play();
      }
    });

    prevBtn.addEventListener('click', () => {
      if (isLoop) {
        audioElement.currentTime = 0;
        if (isPlaying) audioElement.play();
      } else {
        currentTrackIndex = (currentTrackIndex - 1 + allPlaylistItems.length) % allPlaylistItems.length;
        loadTrack(currentTrackIndex);
        if (isPlaying) audioElement.play();
      }
    });

    audioElement.addEventListener('ended', () => {
      if (isLoop) {
        audioElement.currentTime = 0;
        audioElement.play();
      } else {
        currentTrackIndex = getNextIndex();
        loadTrack(currentTrackIndex);
        audioElement.play().catch(err => console.log("Error al pasar de pista:", err));
      }
    });

    shuffleBtn.addEventListener('click', () => {
      isShuffle = !isShuffle;
      shuffleBtn.classList.toggle('active', isShuffle);
    });

    loopBtn.addEventListener('click', () => {
      isLoop = !isLoop;
      loopBtn.classList.toggle('active', isLoop);
    });

    volumeSlider.addEventListener('input', (e) => {
      audioElement.volume = e.target.value;
      updateMuteIcon();
    });

    muteBtn.addEventListener('click', () => {
      if (audioElement.volume > 0) {
        previousVolume = audioElement.volume;
        audioElement.volume = 0;
        volumeSlider.value = 0;
      } else {
        audioElement.volume = previousVolume || 1;
        volumeSlider.value = audioElement.volume;
      }
      updateMuteIcon();
    });

    function updateMuteIcon() {
      if (audioElement.volume === 0) {
        muteBtn.innerText = "🔇";
      } else if (audioElement.volume < 0.5) {
        muteBtn.innerText = "🔉";
      } else {
        muteBtn.innerText = "🔊";
      }
    }

    function addToHistory(title, src) {
      if (historyList.length > 0 && historyList[0].src === src) return;
      
      historyList.unshift({ title, src });
      if (historyList.length > 15) historyList.pop();

      renderHistory();
    }

    function renderHistory() {
      if (historyList.length === 0) {
        emptyHistory.style.display = 'block';
        sectionHistory.querySelectorAll('.playlist-item').forEach(el => el.remove());
        return;
      }
      emptyHistory.style.display = 'none';
      
      sectionHistory.querySelectorAll('.playlist-item').forEach(el => el.remove());

      historyList.forEach((track) => {
        const div = document.createElement('div');
        div.className = 'playlist-item';
        div.innerHTML = `<span>${track.title}</span><span class="runic-text">REC</span>`;
        div.addEventListener('click', () => {
          const idx = Array.from(allPlaylistItems).findIndex(el => el.getAttribute('data-src') === track.src);
          if (idx !== -1) {
            loadTrack(idx);
            audioElement.play().then(() => { playBtn.innerText = "⏸"; isPlaying = true; });
          }
        });
        sectionHistory.appendChild(div);
      });
    }

    favToggleBtn.addEventListener('click', () => {
      const currentItem = allPlaylistItems[currentTrackIndex];
      const src = currentItem.getAttribute('data-src');
      const title = currentItem.getAttribute('data-title');

      const existsIndex = favoritesList.findIndex(fav => fav.src === src);
      if (existsIndex >= 0) {
        favoritesList.splice(existsIndex, 1);
      } else {
        favoritesList.push({ title, src });
      }
      updateFavButtonState();
      renderFavorites();
    });

    function updateFavButtonState() {
      const currentItem = allPlaylistItems[currentTrackIndex];
      const src = currentItem.getAttribute('data-src');
      const isFav = favoritesList.some(fav => fav.src === src);
      if (isFav) {
        favToggleBtn.classList.add('is-fav');
      } else {
        favToggleBtn.classList.remove('is-fav');
      }
    }

    function renderFavorites() {
      sectionFavorites.querySelectorAll('.playlist-item').forEach(el => el.remove());
      if (favoritesList.length === 0) {
        emptyFavorites.style.display = 'block';
        return;
      }
      emptyFavorites.style.display = 'none';

      favoritesList.forEach((track) => {
        const div = document.createElement('div');
        div.className = 'playlist-item';
        div.innerHTML = `<span>⭐ ${track.title}</span><span class="runic-text">FAV</span>`;
        div.addEventListener('click', () => {
          const idx = Array.from(allPlaylistItems).findIndex(el => el.getAttribute('data-src') === track.src);
          if (idx !== -1) {
            loadTrack(idx);
            audioElement.play().then(() => { playBtn.innerText = "⏸"; isPlaying = true; });
          }
        });
        sectionFavorites.appendChild(div);
      });
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active-tab'));
      document.querySelectorAll('.playlist-section').forEach(sec => sec.classList.remove('active-section'));

      if (tabName === 'playlist') {
        document.querySelector('.tab-btn:nth-child(1)').classList.add('active-tab');
        document.getElementById('sectionPlaylist').classList.add('active-section');
      } else if (tabName === 'history') {
        document.querySelector('.tab-btn:nth-child(2)').classList.add('active-tab');
        document.getElementById('sectionHistory').classList.add('active-section');
      } else if (tabName === 'favorites') {
        document.querySelector('.tab-btn:nth-child(3)').classList.add('active-tab');
        document.getElementById('sectionFavorites').classList.add('active-section');
      }
    }

    audioElement.addEventListener('timeupdate', () => {
      if (audioElement.duration && !isNaN(audioElement.duration)) {
        const progressPercent = (audioElement.currentTime / audioElement.duration) * 100;
        progressFilled.style.width = `${progressPercent}%`;

        let currentMinutes = Math.floor(audioElement.currentTime / 60);
        let currentSeconds = Math.floor(audioElement.currentTime % 60);
        currentTimeEl.innerText = `${String(currentMinutes).padStart(2, '0')}:${String(currentSeconds).padStart(2, '0')}`;

        let durMinutes = Math.floor(audioElement.duration / 60);
        let durSeconds = Math.floor(audioElement.duration % 60);
        durationEl.innerText = `${String(durMinutes).padStart(2, '0')}:${String(durSeconds).padStart(2, '0')}`;
      }
    });

    progressBar.addEventListener('click', (e) => {
      const width = progressBar.clientWidth;
      const clickX = e.offsetX;
      if (audioElement.duration && !isNaN(audioElement.duration)) {
        audioElement.currentTime = (clickX / width) * audioElement.duration;
      }
    });

    setInterval(() => {
      beatNodes.forEach((node, idx) => {
        if (isPlaying && idx === activeStep) {
          node.classList.add('active-step');
        } else {
          node.classList.remove('active-step');
        }
      });

      if (isPlaying) {
        activeStep = (activeStep + 1) % beatNodes.length;
        bars.forEach(bar => {
          bar.style.height = `${Math.floor(Math.random() * 80) + 15}%`;
        });
      } else {
        bars.forEach(bar => { bar.style.height = '10%'; });
      }
    }, 140);

    loadTrack(0);
  </script>
</body>
</html>
